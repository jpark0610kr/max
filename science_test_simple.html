<style>html,body{background:#f4f9fb !important;margin:0}*{box-sizing:border-box}body{font-family:-apple-system,"Segoe UI",Arial,sans-serif;color:#0a2e44;line-height:1.45}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').replace(/^(a|an|the) /,'').trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function fibOk(inp,acc){const x=norm(inp);if(!x)return false;return acc.some(a=>{a=norm(a);return x==a||x.replace(/ /g,'')==a.replace(/ /g,'')||(a.length>5&&lev(x,a)<=1)})}
const ah=a=>Array.isArray(a)?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':esc(a);
const lab=it=>/^\d/.test(it.id)?'Q'+it.id:it.id;
let i=0;const R=[];
function draw(){if(i>=ITEMS.length)return fin();const it=ITEMS[i],r=R[i],n=ITEMS.length;let body='',fb='';
 if(it.t=='fib'){body='<input id="f" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" '+(r?'disabled value="'+esc(r.pick)+'"':'')+' onkeydown="if(event.key==\'Enter\')chk()">'+(r?'':'<div class="row"><button class="btn" onclick="chk()">Check</button></div>');
  if(r)fb='<div class="fb '+(r.ok?'good':'bad')+'">'+(r.ok?'✅ Correct!':'❌ Answer: <b>'+esc(it.ans)+'</b>')+(it.note?'<br><i>'+esc(it.note)+'</i>':'')+'</div>'}
 else if(it.t=='tf'){const c=v=>!r?'':(v===it.tf?'good':(v===r.pick?'bad':''));
  body='<div class="two"><button class="opt '+c(true)+'" '+(r?'disabled':'')+' onclick="tfp(true)">True</button><button class="opt '+c(false)+'" '+(r?'disabled':'')+' onclick="tfp(false)">False</button></div>';
  if(r&&r.stage==1)body+='<p><b>It is false. Which word replaces the underlined words?</b></p><input id="f" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==\'Enter\')tff()"><div class="row"><button class="btn" onclick="tff()">Check</button></div>';
  if(r&&r.ok!=null)fb='<div class="fb '+(r.ok?'good':'bad')+'">'+(r.ok?'✅ Correct!':'❌ Not quite.')+' '+(it.tf?'It is <b>true</b>.':'It is false.'+(it.plain?'':' Correct: <b>'+esc(it.ans)+'</b>'))+(it.note?'<br><i>'+esc(it.note)+'</i>':'')+'</div>'}
 else{body='<textarea id="f" rows="3" placeholder="Write your answer first, then tap Reveal" '+(r?'disabled':'')+'>'+(r?esc(r.pick):'')+'</textarea>'+(r?'':'<div class="row"><button class="btn" onclick="rev()">Reveal answer</button></div>');
  if(r){fb='<div class="fb info"><b>Answer:</b>'+ah(it.ans)+(it.note?'<i>'+esc(it.note)+'</i>':'')+'</div>';
   fb+=r.ok==null?'<div class="row"><button class="btn ok" onclick="mk(true)">⭕ I got it</button><button class="btn no" onclick="mk(false)">❌ I missed it</button></div>':'<div class="fb '+(r.ok?'good':'bad')+'">'+(r.ok?'⭕ Got it':'❌ Missed')+'</div>'}}
 const can=r&&r.ok!=null;
 $('#app').innerHTML='<div class="card"><div class="meta"><span>'+lab(it)+' · '+(i+1)+' / '+n+'</span><span>Score '+R.filter(x=>x&&x.ok).length+'</span></div><div class="bar"><i style="width:'+i/n*100+'%"></i></div>'+(it.warn?'<div class="warn">⚠️ '+esc(it.warn)+'</div>':'')+'<div class="q">'+(it.t=='tf'?(it.q.includes('<u>')?'True, or fix the underlined word:<br>'+it.q:'True or False: '+it.q):esc(it.q))+'</div>'+body+fb+'<div class="nav"><button class="btn alt" onclick="i--;draw()" '+(i?'':'disabled')+'>◀ Prev</button><button class="btn" onclick="i++;draw()" '+(can?'':'disabled')+'>'+(i==n-1?'Finish':'Next ▶')+'</button></div></div>';
 if(!r&&it.t=='fib')setTimeout(()=>{const e=$('#f');e&&e.focus()},30)}
function chk(){if(R[i])return;const v=$('#f').value;if(!v.trim())return;R[i]={ok:fibOk(v,ITEMS[i].acc),pick:v};draw()}
function tfp(v){const it=ITEMS[i];if(R[i])return;if(v!==it.tf)R[i]={ok:false,pick:v,stage:2};else if(it.tf||it.plain)R[i]={ok:true,pick:v,stage:2};else R[i]={ok:null,pick:v,stage:1};draw()}
function tff(){const r=R[i];const v=$('#f').value;if(!v.trim())return;r.ok=fibOk(v,ITEMS[i].fix);r.stage=2;draw()}
function rev(){R[i]={pick:$('#f').value,ok:null};draw()}
function mk(ok){R[i].ok=ok;draw()}
function fin(){const s=R.filter(x=>x&&x.ok).length,n=ITEMS.length;const wrong=ITEMS.map((it,k)=>({it,r:R[k]})).filter(x=>!x.r||!x.r.ok);
 $('#app').innerHTML='<div class="card"><div class="big">'+s+' / '+n+'</div><p style="text-align:center">'+(s/n>=.9?'Amazing! 🌊':s/n>=.7?'Great job!':'Keep practicing!')+'</p><div class="row" style="justify-content:center"><button class="btn" onclick="i=0;R.length=0;draw()">Try again</button></div><h3>Missed ('+wrong.length+')</h3>'+wrong.map(x=>'<div class="rv"><b>'+lab(x.it)+'</b> '+(x.it.t=='tf'?x.it.q:esc(x.it.q))+'<br>✅ <b>'+(x.it.t=='tf'?(x.it.tf?'True':'False'+(x.it.plain?'':' → '+esc(x.it.ans))):esc(Array.isArray(x.it.ans)?x.it.ans.join(' · '):x.it.ans))+'</b></div>').join('')+'</div>'}
draw();
</script></body></html>
