<style>
html,body{background:#dff1f5 !important;margin:0;padding:0}
*{box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#0a2e44;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:1.45rem;margin:6px 0 2px;color:#08506b}
.sub{margin:0 0 12px;color:#35637a;font-size:.95rem}
.tabs,.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button{flex:1 1 auto;padding:10px 8px;border:2px solid #0d6e8a;background:#fff;color:#08506b;border-radius:10px;font-weight:700;font-size:.95rem;cursor:pointer}
.tabs button.on{background:#0d6e8a;color:#fff}
.chips button{padding:6px 12px;border:1.5px solid #7fb4c6;background:#f4fbfd;color:#2b5a70;border-radius:99px;font-size:.88rem;cursor:pointer}
.chips button.on{background:#08506b;border-color:#08506b;color:#fff}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(8,80,107,.15)}
.bar{height:8px;background:#cfe6ed;border-radius:6px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:#0d6e8a;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:.9rem;color:#35637a;margin-bottom:10px}
.q{font-size:1.15rem;font-weight:700;margin:6px 0 14px}

.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.btn{padding:10px 18px;border:0;border-radius:10px;background:#0d6e8a;color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
.btn.alt{background:#e3f1f6;color:#08506b}
.btn:disabled{opacity:.4;cursor:default}
.flip{min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;padding:20px;border:2px dashed #7fb4c6;border-radius:14px;background:#f4fbfd}
.flip .t{font-size:1.4rem;font-weight:800;color:#08506b}
.flip .d{font-size:1.1rem}
.flip small{color:#6a93a5;margin-top:10px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.mt button.sel{border-color:#0d6e8a;background:#d6edf5}

.mt button.shake{background:#fde0de;border-color:#d9534f}
.big{font-size:2.4rem;font-weight:800;color:#08506b;text-align:center;margin:4px 0}
.rev{border-top:1px solid #d3e6ed;padding:10px 0;font-size:.95rem}
.rev b{color:#08506b}
.cf{position:fixed;top:-12px;width:10px;height:14px;z-index:9;animation:fall 2.4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}

<body>
<div class="wrap">
  <h1>Science Q5 – Marine Geology</h1>
  <p class="sub">Investigating God's World · Chapter 4 (4.1–4.4)</p>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="chips"></div>
  <div id="app"></div>
</div>

<script>
/* ---------- DATA (all from textbook Ch. 4, 4.1–4.4) ---------- */
// [section, term, definition]
const TERMS=[
[1,"hydrosphere","All water on Earth, whether liquid, solid, or gas"],
[1,"oceanography","Study of the ocean"],
[1,"salinity","Saltiness"],
[1,"tributary","Stream that empties into a river and joins its course"],
[1,"drainage basin","Land drained by a river; watershed"],
[1,"aquifer","Layer of rock that holds water"],
[1,"drainage divide","High ridge that separates two river systems"],
[1,"continental divide","Drainage divide at which two major river systems flow into different oceans"],
[2,"wave","Back-and-forth movement that transfers energy"],
[2,"tsunami","Enormous wave caused by an earthquake on the ocean floor"],
[2,"tide","Daily predictable movement of the ocean caused by the moon's gravitational pull"],
[2,"high tide","When the ocean tide is at its highest point"],
[2,"low tide","When the ocean tide is at its lowest point"],
[2,"spring tide","Highest high tide, during a full or new moon, when the sun's and moon's gravitational forces combine"],
[2,"neap tide","Weaker high tide during a quarter moon, when the sun's and moon's gravitational forces work at right angles against each other"],
[2,"ocean current","Large stream that moves through the ocean"],
[2,"surface current","Ocean current that moves across the surface of the ocean"],
[2,"subsurface current","Ocean current that moves deep in the ocean"],
[2,"upwelling","Upward-flowing current that happens when wind pushes surface water away from the coast"],
[3,"shore","Land along the edge of the ocean"],
[3,"longshore drift","Process in which sediments are transported along the coast with the current"],
[3,"sandbar","Offshore ridge made of sand and other sediments"],
[3,"barrier island","Island parallel to the mainland's shore"],
[3,"estuary","Body of water where the river meets the ocean; contains brackish water"],
[3,"salt marsh","Low area of land near the coast that floods with the tide"],
[4,"continental crust","Thicker part of the earth's crust that lies beneath the continents"],
[4,"oceanic crust","Thinner part of the earth's crust below the ocean basins"],
[4,"continental margin","Underwater area of continental crust: continental shelf, slope, and rise"],
[4,"continental shelf","Underwater plains that border the continents"],
[4,"continental slope","Steep incline at the edge of the continental shelf leading toward the ocean floor"],
[4,"continental rise","Buildup of sediment at the base of the continental slope"],
[4,"abyssal plain","Flat and mostly level floor of the ocean"],
[4,"ooze","Type of seafloor mud made from minerals and the remains of tiny ocean organisms"],
[4,"seamount","Underwater volcanic mountain"],
[4,"mid-ocean ridge","Underwater mountain range"],
[4,"rift","Valley where the oceanic crust seems to be separating"],
[4,"subduction","Tectonic plate activity in which a heavier plate slides under a lighter plate"],
[4,"ocean trench","Deep valley that cuts through the abyssal plain; deepest places of the ocean"],
[4,"hydrothermal vent","Opening in the ocean floor that releases hot, mineral-rich water"]
];
// [section, question, answer]  (short-answer flashcards)
const QA=[
[1,"Name three ways water is essential for life.","Every living cell needs water; rain helps plants grow; plants use water in photosynthesis (phytoplankton supply 50–80% of Earth's oxygen)."],
[1,"How does salt water differ chemically from fresh water?","Salt water contains additional dissolved elements, including the minerals that make it salty."],
[2,"How do ocean currents help regulate Earth's moderate temperature?","Warm water from near the equator circulates to colder places and cold water circulates to warm places, so cold places are warmed and hot places are cooled."],
[2,"Why is the ocean warmer at the Tropic of Cancer than at the Arctic Circle?","It is closer to the equator, where ocean water absorbs more heat from the sun."],
[2,"What is the difference between a surface current and a subsurface current?","A surface current moves across the ocean's surface (pushed by wind). A subsurface current moves below the surface, deep in the ocean."],
[3,"How do sandbars and barrier islands protect the mainland?","They break large waves before the waves can erode the coast or flood the mainland."],
[3,"How might a dam or wall near a river's mouth hurt sandy beaches farther down the coast?","It blocks or reroutes the sediments carried by longshore drift, so less sand reaches those beaches."],
[3,"How does planting grasses in coastal dunes protect communities farther inland?","Grasses trap sand and help dunes keep their shape. Dunes act as a natural erosion barrier and stop flooding."],
[4,"Why was the HMS Challenger Expedition important?","It was the world's first oceanographic expedition. The crew measured depths and temperatures, mapped parts of the sea floor, and discovered the Mariana Trench."]
];
// [section, question, correct, wrong1, wrong2, wrong3, explanation]
const MCS=[
[1,"Which of these is NOT part of the hydrosphere?","Mountains","Rivers","Polar ice caps","Water vapor","The hydrosphere is all water on Earth (liquid, solid, or gas)."],
[1,"About how much of Earth's surface is covered with water?","70 percent","30 percent","50 percent","90 percent","About seventy percent of Earth's surface is water."],
[1,"Scientists estimate that phytoplankton supply how much of Earth's oxygen?","50 to 80 percent","5 to 10 percent","20 to 30 percent","95 to 100 percent","Tiny ocean organisms called phytoplankton give off oxygen during photosynthesis."],
[1,"A water molecule contains…","two hydrogen atoms and one oxygen atom","one hydrogen atom and two oxygen atoms","two hydrogen atoms and two oxygen atoms","one hydrogen atom and one oxygen atom","H₂O = 2 hydrogen + 1 oxygen."],
[1,"What is the largest drainage basin in the United States?","Mississippi River Basin","Colorado River Basin","Columbia River system","St. Lawrence River basin","Its tributaries empty into the Gulf of Mexico."],
[1,"Rain that falls west of the Great Divide eventually flows into the…","Pacific Ocean","Atlantic Ocean","Gulf of Mexico","Arctic Ocean","Rain east of the Eastern Continental Divide drains into the Atlantic."],
[1,"Old Faithful in Yellowstone National Park is a…","geyser","aquifer","tributary","drainage divide","Heated groundwater erupts at the surface, about twenty times a day."],
[2,"Waves of the sea are caused by…","wind blowing over the water","the moon's gravity","earthquakes","the earth's rotation only","Wind causes waves; the moon and sun cause tides."],
[2,"A tsunami is caused by…","an earthquake on the ocean floor","wind","the moon's pull","a hurricane","Tectonic plate activity moves the water above the earthquake's hypocenter."],
[2,"Tides are caused primarily by…","the gravitational pull of the moon","wind","ocean currents","the sun's heat","The moon's gravity makes bulges of water, which are high tides."],
[2,"A spring tide happens during…","a full moon or new moon","a quarter moon only","a lunar eclipse only","any day of the month","The sun and moon are aligned, so their gravity combines."],
[2,"A neap tide happens during…","a quarter moon","a full moon","a new moon","a tsunami","The sun and moon are at right angles and almost cancel each other out."],
[2,"Who is called the Pathfinder of the Sea?","Matthew Maury","Jacques Piccard","Robert Ballard","James Cameron","Maury designed a system for finding the ocean's currents."],
[2,"Why is the Gulf Stream a warm current?","It begins near the tip of southern Florida, near the Tropic of Cancer","It begins in the Arctic Ocean","It flows toward the poles only","It is pushed by the moon","Warm water from near the equator is carried toward the poles."],
[2,"In the Northern Hemisphere, winds move surface currents…","clockwise","counterclockwise","straight north","straight east","In the Southern Hemisphere it is counterclockwise."],
[2,"How do upwellings help ocean life?","They bring up nutrients from deep water","They make the water saltier","They cause tsunamis","They stop the tides","Subsurface currents and upwellings distribute nutrients found in deep water."],
[2,"Tsunamis happen more often near the…","Ring of Fire","Great Divide","Gulf Stream","Tropic of Cancer","The Ring of Fire is a chain of geologically active volcanoes around the Pacific Ocean."],
[3,"Longshore drift transports…","sediments along the coast with the current","fish toward the shore","salt into rivers","tsunamis across the ocean","Without longshore drift we would not have the beaches we enjoy."],
[3,"What kind of water is found in an estuary?","Brackish water","Fresh water only","Salt water only","Distilled water","Estuaries mix salt water from the ocean tide with fresh water from a river."],
[3,"Islands that lie parallel to the mainland's shore are called…","barrier islands","atolls","seamounts","sandbars","A barrier island breaks large waves, like a sandbar."],
[4,"What is the underwater part of the continental crust called?","Continental margin","Abyssal plain","Mid-ocean ridge","Ocean trench","It has three parts: shelf, slope, and rise."],
[4,"Which is NOT part of the continental margin?","Abyssal plain","Continental shelf","Continental slope","Continental rise","The abyssal plain is the flat ocean floor between the continental margins."],
[4,"What is the deepest place on Earth?","Challenger Deep in the Mariana Trench","The abyssal plain","The continental slope","The Galapagos Rift","It is about seven miles below the surface."],
[4,"Which of these is NOT caused by plate tectonics?","Ocean currents","Hydrothermal vents","Ocean trenches","Rifts","Currents are caused by wind, earth's rotation, the sun's heat, and water density."],
[4,"Which submersible found hydrothermal vents in 1977?","Alvin","Trieste","HMS Challenger","Maury","Alvin explored the mid-ocean ridge near the Galapagos Rift."],
[4,"A black smoker looks dark and is hotter because of…","sulfur discharged from the vent","barium and calcium","fresh water","sand","White smokers are cooler and emit minerals like barium, calcium, and silicon."],
[4,"The Marshall Islands in the Pacific Ocean are an…","atoll","estuary","aquifer","trench","Atolls are circular coral reef islands that form around seamounts."],
[4,"Ocean trenches form where…","a heavier plate slides under a lighter plate","rivers meet the ocean","wind pushes water from shore","sediment builds up","This plate activity is called subduction."]
];
// [section, statement, true?, fix]
const TFS=[
[1,"Water vapor is part of the hydrosphere.",true,""],
[1,"Most of Earth's water is fresh water.",false,"Only about 3% is fresh; the rest contains salt."],
[1,"A tributary is a ridge that separates two river systems.",false,"That is a drainage divide. A tributary is a stream that empties into a river."],
[2,"Waves carry water from one side of the ocean to the other.",false,"Waves carry energy. Water molecules move in circles inside the wave."],
[2,"Tsunamis are formed by wind.",false,"Tsunamis are caused by earthquakes on the ocean floor."],
[2,"A spring tide is the weakest high tide.",false,"Spring tide is the highest high tide. Neap tide is the weakest."],
[2,"Cold water is denser than warm water.",true,""],
[2,"In the Southern Hemisphere, surface currents move counterclockwise.",true,""],
[3,"Longshore drift moves sediments in the direction of the current.",true,""],
[3,"Sandbars help break large waves that could erode the mainland.",true,""],
[3,"Salt marsh grasses filter pollution and prevent coastal erosion.",true,""],
[4,"The world's first oceanographic expedition was led by the crew of the Alvin.",false,"It was the crew of the HMS Challenger."],
[4,"The thinner part of the earth's crust below the ocean basins is called continental crust.",false,"It is called oceanic crust."],
[4,"The continental rise is made of sediments.",true,""],
[4,"Seamounts, ridges, and rifts are found in the continental plain.",false,"They are found in the abyssal plain."],
[4,"Ocean trenches were caused by subduction.",true,""],
[4,"The deepest place on the earth is the abyssal plain.",false,"It is Challenger Deep in the Mariana Trench (an ocean trench)."],
[4,"Hydrothermal vents are openings in the ocean floor that emit hot, mineral-rich water.",true,""]
];
// [section, question, [accepted answers]]
const FIBS=[
[1,"All of the earth's water is called the ______.",["hydrosphere"]],
[1,"The study of the earth's ocean is called ______.",["oceanography"]],
[1,"The saltiness of ocean water is called ______.",["salinity"]],
[1,"A stream that empties into a river is a ______.",["tributary"]],
[1,"A watershed is another name for the land that makes a ______.",["drainage basin"]],
[1,"Groundwater is held in an ______.",["aquifer"]],
[1,"A high ridge that separates two river systems is a ______.",["drainage divide"]],
[2,"An enormous wave caused by an underwater earthquake is a ______.",["tsunami"]],
[2,"A high tide at its very highest during a full or new moon is a ______ tide.",["spring"]],
[2,"A high tide at its weakest during a quarter moon is a ______ tide.",["neap"]],
[2,"An upward-flowing ocean current is called an ______.",["upwelling"]],
[3,"The land along the edge of the ocean is called the ______.",["shore"]],
[3,"An offshore ridge made of sand and other sediments is a ______.",["sandbar"]],
[3,"A body of water where a river meets the ocean is an ______.",["estuary"]],
[4,"An underwater volcanic mountain is a ______.",["seamount"]],
[4,"The flat and mostly level floor of the ocean is the ______ plain.",["abyssal"]],
[4,"A valley where the oceanic crust seems to be separating is a ______.",["rift"]],
[4,"The thinner crust below the ocean basins is ______ crust.",["oceanic"]],
[4,"The deepest place on earth is in the ______ Trench.",["mariana"]],
[4,"The submersible ______ found hydrothermal vents in 1977.",["alvin"]]
];

/* ---------- HELPERS ---------- */
const $=s=>document.querySelector(s);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=a=>S.sec?a.filter(x=>x[0]==S.sec):a;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>s.toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').replace(/^(a|an|the) /,'').trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=0;j<=b.length;j++)m[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function fibOk(inp,acc){const x=norm(inp);if(!x)return false;
 return acc.some(a=>{a=norm(a);return x==a||x.replace(/ /g,'')==a.replace(/ /g,'')||(a.length>5&&lev(x,a)<=1)})}
function confetti(){const c=['#0d6e8a','#1f9d6b','#f0b429','#ef6f4f','#7fb4c6'];
 for(let i=0;i<60;i++){const d=document.createElement('div');d.className='cf';
 d.style.left=Math.random()*100+'vw';d.style.background=c[i%5];d.style.animationDelay=Math.random()*.8+'s';
 document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}}

/* ---------- STATE / UI ---------- */
const S={mode:'cards',sec:0};
const MODES=[['cards','Flashcards'],['mc','Multiple Choice'],['tf','True / False'],['fib','Fill-in'],['match','Matching'],['test','Test']];
const SECS=[[0,'All (4.1–4.4)'],[1,'4.1 Hydrosphere'],[2,'4.2 Ocean Movement'],[3,'4.3 Coast'],[4,'4.4 Ocean Floor']];
function head(){
 $('#tabs').innerHTML=MODES.map(m=>`<button class="${S.mode==m[0]?'on':''}" onclick="S.mode='${m[0]}';start()">${m[1]}</button>`).join('');
 $('#chips').innerHTML=SECS.map(s=>`<button class="${S.sec==s[0]?'on':''}" onclick="S.sec=${s[0]};start()">${s[1]}</button>`).join('');
}
function start(){head();
 if(S.mode=='cards')initCards();else if(S.mode=='match')initMatch();else initQuiz();}

/* ----- Flashcards ----- */
let C={d:[],i:0,f:false};
function initCards(){C.d=shuf([...pool(TERMS).map(t=>({s:t[0],f:t[1],b:t[2],k:'t'})),...pool(QA).map(t=>({s:t[0],f:t[1],b:t[2],k:'q'}))]);C.i=0;C.f=false;drawCards()}
function drawCards(){const c=C.d[C.i];
 $('#app').innerHTML=`<div class="card"><div class="meta"><span>Card ${C.i+1} / ${C.d.length}</span><span>${c.k=='q'?'Short answer':'Term'} · ${'4.'+c.s}</span></div>
 <div class="bar"><i style="width:${(C.i+1)/C.d.length*100}%"></i></div>
 <div class="flip" onclick="C.f=!C.f;drawCards()">${C.f?`<div class="d">${esc(c.b)}</div>`:`<div class="${c.k=='q'?'d':'t'}">${esc(c.f)}</div><small>tap to flip</small>`}</div>
 <div class="nav"><button class="btn alt" onclick="cardGo(-1)" ${C.i==0?'disabled':''}>◀ Prev</button><button class="btn alt" onclick="initCards()">Shuffle</button><button class="btn" onclick="cardGo(1)" ${C.i==C.d.length-1?'disabled':''}>Next ▶</button></div></div>`}
function cardGo(n){C.i+=n;C.f=false;drawCards()}

/* ----- Quiz engine (MC / TF / Fill-in / Test) ----- */
let Q={items:[],i:0,res:[],mode:''};
function mkMC(r){const o=shuf(r.slice(2,6));return{t:'mc',q:r[1],opts:o,a:o.indexOf(r[2]),ans:r[2],ex:r[6]}}
function mkTF(r){return{t:'tf',q:r[1],opts:['True','False'],a:r[2]?0:1,ans:r[2]?'True':'False',ex:r[3]}}
function mkFIB(r){return{t:'fib',q:r[1],acc:r[2],ans:r[2][0],ex:''}}
function initQuiz(){let it=[];const M=S.mode;
 if(M=='mc')it=shuf(pool(MCS)).map(mkMC);
 else if(M=='tf')it=shuf(pool(TFS)).map(mkTF);
 else if(M=='fib')it=shuf(pool(FIBS)).map(mkFIB);
 else it=shuf([...shuf(pool(MCS)).slice(0,12).map(mkMC),...shuf(pool(TFS)).slice(0,8).map(mkTF),...shuf(pool(FIBS)).slice(0,10).map(mkFIB)]);
 Q={items:it,i:0,res:[],mode:M};drawQ()}
function score(){return Q.res.filter(r=>r&&r.ok).length}
function drawQ(){
 if(Q.i>=Q.items.length)return results();
 const it=Q.items[Q.i],r=Q.res[Q.i],n=Q.items.length;
 let body='';
 if(it.t=='fib'){body=`<input class="fib" id="fi" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" ${r?'disabled value="'+esc(r.pick)+'"':''} onkeydown="if(event.key=='Enter')checkFib()">
  ${r?'':'<div class="nav" style="justify-content:flex-start"><button class="btn" onclick="checkFib()">Check</button></div>'}`}
 else body=it.opts.map((o,k)=>`<button class="opt ${r?(k==it.a?'good':(k==r.pick?'bad':'')):''}" ${r?'disabled':''} onclick="pick(${k})">${esc(o)}</button>`).join('');
 const fb=r?`<div class="fb ${r.ok?'good':'bad'}">${r.ok?'✅ Correct!':'❌ Not quite. Answer: <b>'+esc(it.ans)+'</b>'} ${it.ex?'<br>'+esc(it.ex):''}</div>`:'';
 $('#app').innerHTML=`<div class="card"><div class="meta"><span>${Q.mode=='test'?'Test · ':''}Question ${Q.i+1} / ${n}</span><span>Score: ${score()}</span></div>
 <div class="bar"><i style="width:${Q.i/n*100}%"></i></div>
 <div class="q">${it.t=='tf'?'True or False: ':''}${esc(it.q)}</div>${body}${fb}
 <div class="nav"><button class="btn alt" onclick="Q.i--;drawQ()" ${Q.i==0?'disabled':''}>◀ Prev</button><button class="btn" onclick="Q.i++;drawQ()" ${r?'':'disabled'}>${Q.i==n-1?'Finish':'Next ▶'}</button></div></div>`;
 if(it.t=='fib'&&!r)setTimeout(()=>{const e=$('#fi');e&&e.focus()},30)}
function pick(k){const it=Q.items[Q.i];if(Q.res[Q.i])return;Q.res[Q.i]={ok:k==it.a,pick:k};drawQ()}
function checkFib(){const it=Q.items[Q.i];if(Q.res[Q.i])return;const v=$('#fi').value;if(!v.trim())return;
 Q.res[Q.i]={ok:fibOk(v,it.acc),pick:v};drawQ()}
function results(){const n=Q.items.length,s=score(),p=Math.round(s/n*100);
 const wrong=Q.items.map((it,i)=>({it,r:Q.res[i]})).filter(x=>!x.r||!x.r.ok);
 const msg=p>=90?'Amazing! Test-ready! 🌊':p>=70?'Great job! Review the misses below.':'Keep practicing — you can do it!';
 if(p>=80)confetti();
 $('#app').innerHTML=`<div class="card"><div class="big">${s} / ${n} (${p}%)</div><p style="text-align:center">${msg}</p>
 <div class="nav" style="justify-content:center"><button class="btn" onclick="initQuiz()">Try again</button></div>
 ${wrong.length?'<h3>Review your misses</h3>'+wrong.map(x=>`<div class="rev"><b>${esc(x.it.q)}</b><br>Answer: ${esc(x.it.ans)}${x.it.ex?'<br><i>'+esc(x.it.ex)+'</i>':''}</div>`).join(''):''}</div>`}

/* ----- Matching ----- */
let M={L:[],R:[],sel:null,done:0,miss:0,n:0};
function initMatch(){const p=shuf(pool(TERMS)).slice(0,6);M={L:shuffIdx(p),R:shuffIdx(p),sel:null,done:0,miss:0,n:p.length,p,ok:{}};drawMatch()}
function shuffIdx(p){return shuf(p.map((_,i)=>i))}
function drawMatch(){const p=M.p;
 if(M.done==M.n){if(M.miss<=1)confetti();
  $('#app').innerHTML=`<div class="card"><div class="big">All matched! 🎉</div><p style="text-align:center">Wrong tries: ${M.miss}</p><div class="nav" style="justify-content:center"><button class="btn" onclick="initMatch()">New round</button></div></div>`;return}
 const b=(side,i)=>{const k=side+i,ok=M.ok[side+i];return `<button class="${ok?'done':''} ${M.sel&&M.sel.k==k?'sel':''} ${M.bad&&M.bad.includes(k)?'shake':''}" ${ok?'disabled':''} onclick="mpick('${side}',${i})">${esc(side=='L'?p[i][1]:p[i][2])}</button>`};
 $('#app').innerHTML=`<div class="card"><div class="meta"><span>Tap a term, then its meaning</span><span>${M.done} / ${M.n} · Wrong: ${M.miss}</span></div>
 <div class="bar"><i style="width:${M.done/M.n*100}%"></i></div>
 <div class="mt"><div>${M.L.map(i=>b('L',i)).join('')}</div><div>${M.R.map(i=>b('R',i)).join('')}</div></div>
 <div class="nav"><button class="btn alt" onclick="initMatch()">New round</button><span></span></div></div>`;
 document.querySelectorAll('.mt>div').forEach(d=>{d.style.display='grid';d.style.gap='8px'})}
function mpick(side,i){M.bad=null;
 if(!M.sel||M.sel.side==side){M.sel={side,i,k:side+i};return drawMatch()}
 const li=side=='L'?i:M.sel.i,ri=side=='R'?i:M.sel.i;
 if(li==ri){M.ok['L'+li]=M.ok['R'+ri]=1;M.done++;M.sel=null}
 else{M.miss++;M.bad=[M.sel.k,side+i];M.sel=null}
 drawMatch();if(M.bad)setTimeout(()=>{M.bad=null;drawMatch()},600)}

start();
</script>
</body>
</html>
