<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spelling List 3 Quiz</title>
<style>
html,body{background:#e8f4f8!important;margin:0;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#23404d}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;text-align:center;color:#1b6a8a;margin:14px 0 4px}.sub{text-align:center;color:#5a7a88;font-size:14px;margin-bottom:12px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px #0002;margin-bottom:14px;text-align:center}
button{font:inherit;border:2px solid #1b6a8a;background:#fff;color:#1b6a8a;border-radius:10px;padding:10px 16px;margin:4px;cursor:pointer}
button.pri{background:#1b6a8a;color:#fff}button:disabled{opacity:.4;cursor:default}
.spk{font-size:44px;width:96px;height:96px;border-radius:50%;padding:0;margin:8px auto;display:block}
.slow{font-size:14px;padding:6px 12px}
.bar{height:8px;background:#dde;border-radius:4px}.bar i{display:block;height:100%;background:#1b6a8a;border-radius:4px}
.meta{font-size:13px;color:#667;margin:6px 0 10px;display:flex;justify-content:space-between}
input{width:100%;box-sizing:border-box;font:inherit;font-size:22px;text-align:center;padding:12px;border:3px solid #b8cfd8;border-radius:12px;letter-spacing:1px}
input.ok{border-color:#2e9e4a;background:#e3f7e8}input.bad{border-color:#c33;background:#fde6e6}
.fb{margin-top:10px;font-weight:700;font-size:18px;min-height:26px}.g{color:#1f8a3b}.r{color:#c33}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.rv{border-top:1px solid #ddd;padding:8px 0;font-size:15px;text-align:left}
.cf{position:fixed;top:-10px;width:9px;height:14px;animation:fall 2.5s linear forwards;z-index:9}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style></head><body><div id="app"></div><script>
const WORDS=["reapplying","refrigerator","rehearsal","relapse","relinquish","resign","boastful","harmful","neglectful","plentiful","purposeful","suspenseful","dedicate","dictation","dictator","diction","indicate","indictment","verdict","vindicate","Deuteronomy","Joshua","consequences","conveniences","hues","inquiries","missionaries","opportunities","prophecies","similarities"];
const DEF={consequences:"the results of some previous action",conveniences:"things that add comfort or save trouble",hues:"the basic names of colors",inquiries:"questions; searches for answers",missionaries:"those sent with the purpose of spreading the Gospel",opportunities:"favorable circumstances; chances for advancements",prophecies:"revelations about the future",similarities:"likenesses"};
const $=id=>document.getElementById(id),A=$('app');
let L=[],i=0,voice=null;
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function getBestVoice(){const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));if(!v.length)return null;
for(const n of ['Samantha','Karen','Google US English','Aria','Jenny','Natural']){const f=v.find(x=>x.name.includes(n));if(f)return f}
return v.find(x=>x.lang=='en-US')||v[0]}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{voice=getBestVoice()};voice=getBestVoice()}
function say(w,slow){if(!('speechSynthesis' in window))return alert('Speech is not supported in this browser.');
speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);voice=voice||getBestVoice();if(voice)u.voice=voice;u.lang='en-US';u.rate=slow?0.5:0.8;speechSynthesis.speak(u)}
function menu(){A.innerHTML=`<h1>📚 Spelling List 3</h1><div class=sub>Listen and type · 30 words</div><div class=card><p>Press 🔊 to hear the word, then type it.<br>Words 23–30 (vocabulary): you hear the <b>meaning</b> and type the word.</p><button class=pri onclick="start(WORDS)">▶ Start (random order)</button><br><button onclick="start(WORDS,1)">▶ Start (list order)</button></div><div class=card style="font-size:14px;text-align:left"><b>Word list</b><br>${WORDS.join(', ')}</div>`}
function start(w,ordered){L=(ordered?w:sh(w)).map(x=>({w:x,d:DEF[x]}));i=0;show()}
function show(){const it=L[i],n=L.length,sc=L.filter(x=>x.ok).length;
A.innerHTML=`<div class=card><div class=bar><i style="width:${i/n*100}%"></i></div><div class=meta><span>${i+1} / ${n}</span><span>Score ${sc}</span></div>
<button class="pri spk" onclick="say(L[i].d||L[i].w)" aria-label="Play word">🔊</button><button class=slow onclick="say(L[i].d||L[i].w,1)">🐢 Slow</button>
<div style="font-size:14px;color:#5a7a88">${it.d?'📖 Listen to the <b>meaning</b>, then type the word':'Listen, then type the word'}</div>${it.d?`<button class=slow onclick="L[i].t=!L[i].t;show()">👁 ${it.t||it.done?'Hide':'Show'} meaning</button>${it.t||it.done?`<div style="margin-top:6px;font-style:italic">${it.d}</div>`:''}`:''}<div style="margin-top:12px"><input id=in ${it.done?'disabled':''} class="${it.done?(it.ok?'ok':'bad'):''}" value="${it.done?it.res:''}" placeholder="Type the word" autocomplete=off autocapitalize=off autocorrect=off spellcheck=false onkeydown="if(event.key=='Enter')${it.done?'go(1)':'chk()'}"></div>
<div class=fb>${it.done?(it.ok?'<span class=g>🎉 Correct!</span>':'<span class=r>Correct spelling: '+it.w+'</span>'):''}</div>
${it.done?'':'<button class=pri onclick="chk()">Check</button>'}
<div class=nav><button ${i?'':'disabled'} onclick="go(-1)">← Prev</button><button class=pri ${it.done?'':'disabled'} onclick="go(1)">${i==n-1?'Finish':'Next →'}</button></div></div><button onclick="if(confirm('Back to menu?'))menu()">☰ Menu</button>`;
if(!it.done)$('in').focus()}
function chk(){const it=L[i],v=$('in').value.trim();if(!v)return;it.res=v;it.ok=v.toLowerCase()==it.w.toLowerCase();it.done=1;show()}
function go(d){i+=d;if(i>=L.length)return fin();show()}
function fin(){const n=L.length,s=L.filter(x=>x.ok).length,p=Math.round(s/n*100),w=L.filter(x=>!x.ok);
A.innerHTML=`<div class=card><h1>${p>=80?'🎉 Great job!':p>=60?'👍 Good effort!':'💪 Keep practicing!'}</h1><div style="font-size:40px">${s} / ${n} (${p}%)</div></div>
${w.length?`<div class=card><b>Review</b>${w.map(x=>`<div class=rv>${x.res?'You typed: <span class=r>'+x.res.replace(/</g,'&lt;')+'</span><br>':''}Correct: <b class=g>${x.w}</b>${x.d?' <i>('+x.d+')</i>':''} <button class=slow onclick="say('${x.w}')">🔊</button></div>`).join('')}</div>`:''}
${w.length?`<button class=pri onclick="start(L.filter(x=>!x.ok).map(x=>x.w))">🔁 Retry wrong words</button>`:''}<button class=pri onclick="start(WORDS)">🔄 Start over</button><button onclick="menu()">☰ Menu</button>`;
if(p>=80)for(let k=0;k<70;k++){const d=document.createElement('b');d.className='cf';d.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360},80%,60%);animation-delay:${Math.random()*1.5}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}}
menu();
</script></body></html>
