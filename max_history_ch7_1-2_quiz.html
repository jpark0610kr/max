<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>History Ch. 7 – Central Asia 7.1–7.2</title>
<style>
html,body{background:#e9f2f7!important;margin:0;color:#14324a;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.w{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:#4a6a82;font-size:14px;margin-bottom:12px}
.tabs,.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:2px solid #14324a;background:#fff;color:#14324a;padding:8px 14px}
button:focus-visible{outline:3px solid #f4a300;outline-offset:2px}
.tabs button.on,.chips button.on{background:#14324a;color:#fff}
.chips button{padding:5px 10px;font-size:14px;border-width:1px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px #14324a22;margin-top:10px}
.bar{height:8px;background:#cfdde7;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#2a9d8f;width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:14px;margin:6px 0}
.q{font-size:19px;line-height:1.4;margin:10px 0 14px}
.o{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}
.o.ok{background:#c9efe3;border-color:#2a9d8f}.o.no{background:#fadadd;border-color:#d6455d}
input[type=text]{font:inherit;width:100%;box-sizing:border-box;padding:12px;border:2px solid #14324a;border-radius:10px}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:15px}
.fb.ok{background:#c9efe3}.fb.no{background:#fadadd}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.go{background:#14324a;color:#fff}
.fc{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;cursor:pointer}
.fc small{display:block;font-size:13px;color:#4a6a82;margin-top:10px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mg button{text-align:left;font-size:14px;padding:10px}
.mg button.sel{background:#f4a300;border-color:#b57600}.mg button.done{background:#c9efe3;border-color:#2a9d8f;opacity:.6}
.mg button.bad{background:#fadadd}
.big{font-size:40px;font-weight:700}
</style></head><body><div class="w">
<h1>History: Central Asia</h1><div class="sub">Chapter 7, sections 7.1 to 7.2 · Eastern Hemisphere History &amp; Geography</div>
<div class="tabs" id="tabs"></div><div class="chips" id="chips"></div><div id="app"></div></div>
<script>
const $=s=>document.querySelector(s);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();

/* [section, term, definition] */
const T=[
['7.1','Russia','Largest country in the world'],
['7.1','Eurasia','Combined landmass of Europe and Asia; world’s largest landmass'],
['7.1','Mount Elbrus','Highest peak in both Russia and all of Europe (Caucasus Mountains)'],
['7.1','Ural Mountains','Mountain range that forms part of the boundary between Europe and Asia'],
['7.1','West Siberian Plain','One of the world’s largest regions of continuously level land'],
['7.1','Volga River','Europe’s longest river; flows through western Russia into the Caspian Sea'],
['7.1','Lake Baikal','World’s deepest freshwater lake'],
['7.1','Caspian Sea','World’s largest inland body of water'],
['7.1','Aral Sea','Saltwater lake shared by Uzbekistan and Kazakhstan; mostly dry because of USSR irrigation'],
['7.1','double landlocked','Country with no ocean access that is surrounded by countries which also have no ocean access'],
['7.1','tundra','Treeless area of frozen ground and limited vegetation'],
['7.1','permafrost','“Eternal frost”; permanently frozen ground'],
['7.1','hydropower','Power generated by moving water'],
['7.1','Kamchatka Peninsula','Part of Russia’s Ring of Fire; has over twenty-five active volcanoes'],
['7.1','Ismoil Somoni','Highest peak in the former USSR (Tajikistan)'],
['7.2','Vladimir the Saint','Man who introduced the Russians to Eastern Orthodoxy (around A.D. 988)'],
['7.2','Ivan III','First true national leader of a united Russia'],
['7.2','Ivan IV','Russian leader who took the title of czar; Ivan the Terrible'],
['7.2','czar','Means “emperor”'],
['7.2','serfs','Class of people in Russia who were little more than slaves'],
['7.2','Crimean War','War fought over Russia’s attempts to invade Ottoman territory (1853–1856)'],
['7.2','Nicholas II','Last czar of Russia'],
['7.2','Karl Marx','Man whose writings promoted Marxism'],
['7.2','capitalism','Free enterprise; economic system that allows individuals to own businesses and make a living without government control'],
['7.2','Marxism','Communism; theory of no classes, no government, no private property, and no religion'],
['7.2','Vladimir Lenin','Leader of the Bolsheviks; leader of the first Communist state in history'],
['7.2','Bolsheviks','Communist group led by Lenin; Russian word meaning “one of the majority”'],
['7.2','propaganda','Information used to promote a particular point of view and influence public opinion'],
['7.2','Joseph Stalin','Dictator of the Soviet Union after Lenin’s death; one of the most brutal rulers of all time'],
['7.2','Great Purge','Period of Stalin’s rule where he exiled, imprisoned, and executed millions of people'],
['7.2','collectivism','System in which individuals must give up the control of all property to the government'],
['7.2','Nikita Khrushchev','Soviet leader who supported the construction of the Berlin Wall']
];

const M=(s,q,a,w,c)=>({s,k:'mc',q,a,w,c});
const F=(s,q,a)=>({s,k:'tf',q,a});
const B=(s,q,a,c)=>({s,k:'fill',q,a:Array.isArray(a)?a:[a],c});
const Q=[
/* 7.1 */
M('7.1','What is the largest country in the world?','Russia',['Kazakhstan','China','Canada']),
M('7.1','What is the world’s largest landmass, made of Europe and Asia combined?','Eurasia',['Africa','Antarctica','Oceania']),
M('7.1','What is the highest peak in both Russia and all of Europe?','Mount Elbrus',['Mount Everest','Ismoil Somoni','Mount Pinatubo']),
M('7.1','Which mountains form part of the boundary between Europe and Asia?','Ural Mountains',['Caucasus Mountains','Altai Mountains','Alps']),
M('7.1','Which is one of the world’s largest regions of continuously level land?','West Siberian Plain',['Ural Plain','Caspian Plain','Gobi Plain']),
M('7.1','What is Europe’s longest river?','Volga River',['Amu Darya','Syr Darya','Yangtze River']),
M('7.1','Which is the world’s deepest freshwater lake?','Lake Baikal',['Caspian Sea','Aral Sea','Lake Elbrus']),
M('7.1','Which is the world’s largest inland body of water?','Caspian Sea',['Lake Baikal','Aral Sea','Volga River']),
M('7.1','Which two countries share the Aral Sea?','Uzbekistan and Kazakhstan',['Russia and Kazakhstan','Tajikistan and Kyrgyzstan','Turkmenistan and Russia']),
M('7.1','Which Central Asian country is double landlocked?','Uzbekistan',['Kazakhstan','Russia','Turkmenistan']),
M('7.1','Which Russian peninsula has over twenty-five active volcanoes?','Kamchatka Peninsula',['Crimean Peninsula','Sinai Peninsula','Korean Peninsula']),
M('7.1','About what percent of Russia’s land area lies within Asia?','75 percent',['25 percent','50 percent','90 percent']),
M('7.1','Turkmenistan is covered by deserts and gets about how many inches of rain per year?','6 inches',['30 inches','60 inches','100 inches']),
M('7.1','Which Central Asian country has impressive oil and natural gas deposits?','Kazakhstan',['Kyrgyzstan','Tajikistan','Uzbekistan']),
M('7.1','Which of these are rare resources found in Kyrgyzstan, Tajikistan, Kazakhstan, and Uzbekistan?','Gold, uranium, and mercury',['Silk, tea, and jade','Rice, cotton, and corn','Diamonds, salt, and iron']),
M('7.1','In what year did the USSR collapse?','1991',['1917','1922','1989']),
M('7.1','Russia is home to almost how many different people groups?','200',['20','50','1,000']),
M('7.1','Which Central Asian country is Ismoil Somoni, the highest peak in the former USSR, located in?','Tajikistan',['Kazakhstan','Turkmenistan','Russia']),
F('7.1','Lake Baikal holds over 20 percent of Earth’s fresh water.',true),
F('7.1','The Caspian Sea is called a sea because of its size and salt content, even though it is surrounded by land.',true),
F('7.1','The Aral Sea is still the fourth largest lake in the world.',false),
F('7.1','The Ural Mountains run east to west.',false),
F('7.1','The Volga River flows into the Caspian Sea.',true),
F('7.1','Mount Elbrus is in the Caucasus Mountains.',true),
F('7.1','About 75 percent of Russia’s population lives in the Asian part of the country.',false),
F('7.1','Tundra is a treeless area of frozen ground and limited vegetation.',true),
F('7.1','The USSR had fifteen countries.',true),
B('7.1','___ is the largest country in the world.','Russia'),
B('7.1','Permafrost means permanently frozen ___.','ground'),
B('7.1','Power generated by moving water is called ___.','hydropower'),
B('7.1','A treeless area of frozen ground is called ___.','tundra'),
B('7.1','Lake ___ is the world’s deepest freshwater lake.','Baikal'),
B('7.1','A country with no ocean access, surrounded by countries with no ocean access, is double ___.','landlocked'),
/* 7.2 */
M('7.2','Who introduced the Russians to a form of Christianity called Eastern Orthodoxy?','Vladimir the Saint',['Vladimir Lenin','Ivan III','Joseph Stalin']),
M('7.2','Who was the first true national leader of a united Russia?','Ivan III',['Ivan IV','Nicholas II','Vladimir the Saint']),
M('7.2','Which Russian leader took the title of czar and was known as the Terrible?','Ivan IV',['Ivan III','Nicholas II','Joseph Stalin']),
M('7.2','The word czar means:','Emperor',['King','President','Saint']),
M('7.2','What was the class of people in Russia who were little more than slaves?','Serfs',['Czars','Bolsheviks','Mongols']),
M('7.2','What war was caused by Russia’s invasion of Ottoman territory?','Crimean War',['Great Purge','World War I','Berlin War']),
M('7.2','Who was the last czar of Russia?','Nicholas II',['Ivan IV','Lenin','Khrushchev']),
M('7.2','Whose writings promoted Marxism?','Karl Marx',['Ivan IV','Vladimir Lenin','Joseph Stalin']),
M('7.2','What do we call the economic system that allows individuals to own businesses without government control?','Capitalism',['Communism','Collectivism','Marxism']),
M('7.2','Who was the leader of the Bolsheviks and the first Communist state in history?','Vladimir Lenin',['Joseph Stalin','Karl Marx','Nikita Khrushchev']),
M('7.2','The Russian word Bolsheviks means:','One of the majority',['Free people','Land of the Rus','Eternal frost']),
M('7.2','Information used to promote a particular point of view is called:','Propaganda',['Collectivism','Capitalism','Perestroika']),
M('7.2','Who became dictator of the Soviet Union after Lenin’s death in 1924?','Joseph Stalin',['Nikita Khrushchev','Karl Marx','Nicholas II']),
M('7.2','What was the period where Stalin exiled, imprisoned, and murdered millions of people?','Great Purge',['Crimean War','Berlin Wall','Propaganda Era']),
M('7.2','What is the system in which individuals must give up control of all property to the government?','Collectivism',['Capitalism','Hydropower','Serfdom']),
M('7.2','Which Soviet leader supported the construction of the Berlin Wall?','Nikita Khrushchev',['Joseph Stalin','Vladimir Lenin','Ivan III']),
M('7.2','In what year was the Union of Soviet Socialist Republics formed?','1922',['1917','1924','1991']),
M('7.2','Russia sold Alaska to the United States in 1867 for how much?','$7.2 million',['$72 million','$7,200','$720 million']),
M('7.2','Who explored the land east of Russia in the 1720s, and has the Bering Strait named for him?','Vitus Bering',['Ivan IV','Marco Polo','Nicholas II']),
M('7.2','Around 1240, which group conquered Russia and controlled it for nearly 250 years?','Mongols',['Vikings','Ottomans','Bolsheviks']),
M('7.2','Which writer was exiled to Kazakhstan for criticizing Joseph Stalin in a letter?','Alexander Solzhenitsyn',['Tolstoy','Chekhov','Dostoyevsky']),
F('7.2','Karl Marx opposed capitalism.',true),
F('7.2','Karl Marx believed there should be no classes, no government, no private property, and no religion.',true),
F('7.2','Lenin gave the Russian people freedom of speech, press, and religion.',false),
F('7.2','Stalin ordered small private farms to band together into collective farms controlled by the government.',true),
F('7.2','Nicholas II was the first czar of Russia.',false),
F('7.2','The Russian army was well prepared to fight in World War I.',false),
F('7.2','In 1917, the Russian people overthrew the government of Czar Nicholas II.',true),
F('7.2','Russia won the Crimean War.',false),
F('7.2','The Berlin Wall separated Communist-controlled East Berlin from free West Berlin.',true),
F('7.2','The Viking tribe called the Rus gave Russia its name.',true),
B('7.2','Ivan ___ was the first true national leader of a united Russia.',['III','3']),
B('7.2','The Crimean War was fought from 1853 to ___.','1856'),
B('7.2','Marxism is also called ___.','Communism'),
B('7.2','Lenin led a Communist group called the ___.','Bolsheviks'),
B('7.2','The Berlin Wall was built in the year ___.','1961'),
B('7.2','Vladimir the Saint introduced the Russians to Eastern ___.','Orthodoxy')
];

const SECS=['All','7.1','7.2'];

let mode='fc',sec='All',st={};
const pool=a=>sec==='All'?a:a.filter(x=>(Array.isArray(x)?x[0]:x.s)===sec);

function head(){
 $('#tabs').innerHTML=[['fc','Flashcards'],['qz','Quiz'],['mt','Matching']].map(([k,n])=>`<button class="${mode===k?'on':''}" data-m="${k}">${n}</button>`).join('');
 $('#chips').innerHTML=SECS.map(s=>`<button class="${sec===s?'on':''}" data-s="${s}">${s==='All'?'All sections':s}</button>`).join('');
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.m){mode=b.dataset.m;start()}
 else if(b.dataset.s){sec=b.dataset.s;start()}
});
function start(){head();({fc:fcInit,qz:qzInit,mt:mtInit})[mode]()}

/* Flashcards */
function fcInit(){st={d:shuf(pool(T)),i:0,f:false,k:0};fcDraw()}
function fcDraw(){
 const c=st.d[st.i];
 $('#app').innerHTML=`<div class="meta"><span>Card ${st.i+1} of ${st.d.length}</span><span>Know it: ${st.k}</span></div>
 <div class="bar"><i style="width:${(st.i)/st.d.length*100}%"></i></div>
 <div class="card fc" id="fc" tabindex="0" role="button"><div>${st.f?esc(c[2]):'<b>'+esc(c[1])+'</b>'}<small>${st.f?'Section '+c[0]:'Tap to flip'}</small></div></div>
 <div class="nav"><button id="pv">Back</button><button id="kn">I know it</button><button class="go" id="nx">Next</button></div>`;
 const flip=()=>{st.f=!st.f;fcDraw()};
 $('#fc').onclick=flip;$('#fc').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
 $('#pv').onclick=()=>{if(st.i>0){st.i--;st.f=false;fcDraw()}};
 const nx=()=>{st.f=false;if(st.i<st.d.length-1){st.i++;fcDraw()}else{$('#app').innerHTML=`<div class="card" style="text-align:center"><div class="big">${st.k}/${st.d.length}</div><p>cards you knew</p><button class="go" onclick="fcInit()">Shuffle again</button></div>`}};
 $('#nx').onclick=nx;$('#kn').onclick=()=>{st.k++;nx()};
}

/* Quiz */
function qzInit(){
 const qs=shuf(pool(Q));
 st={q:qs,i:0,s:0,done:false,wrong:[]};qzDraw();
}
function qzDraw(){
 if(st.i>=st.q.length)return qzEnd();
 const q=st.q[st.i];st.done=false;
 let body='';
 if(q.k==='mc'){st.o=shuf([q.a,...q.w]);body=st.o.map((o,n)=>`<button class="o" data-n="${n}">${esc(o)}</button>`).join('')}
 else if(q.k==='tf')body=`<button class="o" data-n="1">True</button><button class="o" data-n="0">False</button>`;
 else body=`<input type="text" id="fi" autocomplete="off" aria-label="Your answer"><div class="nav"><button class="go" id="ck">Check</button></div>`;
 $('#app').innerHTML=`<div class="meta"><span>Question ${st.i+1} of ${st.q.length} · ${q.s}</span><span>Score: ${st.s}</span></div>
 <div class="bar"><i style="width:${st.i/st.q.length*100}%"></i></div>
 <div class="card"><div class="q">${esc(q.q)}</div>${body}<div id="fb"></div><div class="nav"><span></span><button class="go" id="nx" style="display:none">${st.i===st.q.length-1?'See results':'Next'}</button></div></div>`;
 $('#nx').onclick=()=>{st.i++;qzDraw()};
 if(q.k==='fill'){const go=()=>{if(st.done)return;fin(q,norm($('#fi').value),$('#fi').value.trim()!=='' )};$('#ck').onclick=go;$('#fi').onkeydown=e=>{if(e.key==='Enter')go()};$('#fi').focus()}
 else document.querySelectorAll('.o').forEach(b=>b.onclick=()=>{if(st.done)return;const n=+b.dataset.n;
  const ok=q.k==='mc'?st.o[n]===q.a:(n===1)===q.a;
  document.querySelectorAll('.o').forEach((x,m)=>{const isC=q.k==='mc'?st.o[m]===q.a:(m===1)===q.a;if(isC)x.classList.add('ok');else if(x===b)x.classList.add('no')});
  fin(q,null,true,ok)});
}
function fin(q,val,has,okIn){
 if(q.k==='fill'&&!has)return;
 st.done=true;
 const ok=q.k==='fill'?q.a.some(a=>norm(a)===val):okIn;
 const ans=q.k==='tf'?(q.a?'True':'False'):q.k==='mc'?q.a:q.a[0];
 if(ok)st.s++;else st.wrong.push(q);
 $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'Correct!':'Not quite. Answer: <b>'+esc(ans)+'</b>'}</div>${q.c?'<div class="fb" style="background:#fff6dc">This one wasn’t on the scanned pages. Double-check with the book.</div>':''}`;
 if(q.k==='fill'){$('#fi').disabled=true;$('#ck').style.display='none'}
 $('#nx').style.display='';$('#nx').focus();
}
function qzEnd(){
 const p=Math.round(st.s/st.q.length*100);
 $('#app').innerHTML=`<div class="card" style="text-align:center"><div class="big">${st.s}/${st.q.length}</div><p>${p}%${p>=90?' Amazing!':p>=70?' Nice work!':' Keep practicing, you’ll get it!'}</p>
 <button class="go" onclick="qzInit()">Try again</button>
 ${st.wrong.length?`<button onclick="rev()">Review ${st.wrong.length} missed</button>`:''}</div><div id="rv"></div>`;
 if(p>=90)confetti();
}
function rev(){
 $('#rv').innerHTML=st.wrong.map(q=>`<div class="card"><div class="q" style="font-size:16px">${esc(q.q)}</div><div class="fb ok">${esc(q.k==='tf'?(q.a?'True':'False'):q.k==='mc'?q.a:q.a[0])}</div></div>`).join('');
}
function confetti(){
 const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;width:100%;height:100%';
 c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d');
 const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height/2,v:2+Math.random()*4,r:4+Math.random()*5,c:['#f4a300','#2a9d8f','#d6455d','#14324a'][Math.random()*4|0]}));
 let f=0;(function t(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r)});if(++f<150)requestAnimationFrame(t);else c.remove()})();
}

/* Matching */
function mtInit(){
 const set=shuf(pool(T)).slice(0,8);
 st={set,t:shuf(set),d:shuf(set),a:null,n:0,tries:0};mtDraw();
}
function mtDraw(){
 $('#app').innerHTML=`<div class="meta"><span>Matched ${st.n} of ${st.set.length}</span><span>Misses: ${st.tries}</span></div>
 <div class="bar"><i style="width:${st.n/st.set.length*100}%"></i></div>
 <div class="card"><p style="margin-top:0">Tap a term, then tap its meaning.</p><div class="mg">
 <div>${st.t.map((x,i)=>`<button style="width:100%;margin-bottom:8px" data-t="${i}" class="${x.done?'done':''}">${esc(x[1])}</button>`).join('')}</div>
 <div>${st.d.map((x,i)=>`<button style="width:100%;margin-bottom:8px" data-d="${i}" class="${x.done?'done':''}">${esc(x[2])}</button>`).join('')}</div></div>
 ${st.n===st.set.length?`<p style="text-align:center"><b>All matched!</b></p><button class="go" onclick="mtInit()">New set</button>`:''}</div>`;
 if(st.a!==null)document.querySelector(`[data-t="${st.a}"]`).classList.add('sel');
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(st.t[b.dataset.t].done)return;st.a=+b.dataset.t;mtDraw()});
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
  if(st.a===null||st.d[b.dataset.d].done)return;
  const t=st.t[st.a],d=st.d[b.dataset.d];
  if(t===d){t.done=true;st.n++;st.a=null;mtDraw()}
  else{st.tries++;st.a=null;mtDraw();const nb=document.querySelector(`[data-d="${b.dataset.d}"]`);nb.classList.add('bad');setTimeout(()=>nb&&nb.classList.remove('bad'),600)}
 });
}
start();
</script></body></html>
