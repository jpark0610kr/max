<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Science Ch.3 (3.4–3.6) Quiz</title>
<style>
html,body{background:#eef4ff!important;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1d2b4f}
.wrap{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:20px;text-align:center;margin:8px 0 2px}
.sub{text-align:center;font-size:13px;color:#5a6a92;margin-bottom:10px}
.nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.nav button{border:2px solid #3b6fd8;background:#fff;color:#3b6fd8;border-radius:20px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer}
.nav button.on{background:#3b6fd8;color:#fff}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 12px rgba(30,60,120,.12)}
.bar{height:8px;background:#dde6fa;border-radius:6px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:#3bb273;width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;font-size:13px;color:#5a6a92;margin-bottom:12px}
.q{font-size:18px;font-weight:600;line-height:1.4;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:2px solid #cdd9f5;background:#f8faff;border-radius:12px;font-size:16px;cursor:pointer;color:#1d2b4f}
.opt:disabled{cursor:default}
.opt.ok{background:#d9f5e3;border-color:#3bb273}
.opt.no{background:#fde0e0;border-color:#e05555}
input.fb{width:100%;box-sizing:border-box;padding:12px;font-size:17px;border:2px solid #cdd9f5;border-radius:12px}
.fbk{margin-top:12px;padding:10px;border-radius:10px;font-size:15px;line-height:1.4}
.fbk.ok{background:#d9f5e3}.fbk.no{background:#fde0e0}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{border:none;background:#3b6fd8;color:#fff;font-size:16px;font-weight:600;padding:11px 18px;border-radius:12px;cursor:pointer}
.btn.gray{background:#aab6d6}.btn:disabled{opacity:.4;cursor:default}
.flash{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:600;padding:18px;border-radius:14px;background:#fff7dc;border:2px dashed #e0b83c;cursor:pointer;line-height:1.4}
.flash.back{background:#dff3ff;border-color:#4aa3d8;font-weight:500;font-size:18px}
.hint{text-align:center;font-size:12px;color:#8a97b8;margin-top:6px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt button{padding:10px;border:2px solid #cdd9f5;background:#f8faff;border-radius:10px;font-size:14px;cursor:pointer;color:#1d2b4f;text-align:left}
.mt button.sel{border-color:#3b6fd8;background:#e3ecff}
.mt button.done{background:#d9f5e3;border-color:#3bb273;opacity:.7}
.mt button.bad{background:#fde0e0;border-color:#e05555}
.big{font-size:44px;text-align:center;font-weight:800;color:#3b6fd8}
.rev{font-size:14px;border-top:1px solid #e1e8fa;padding:8px 0;line-height:1.4}
.conf{position:fixed;top:-30px;font-size:24px;animation:fall 2.6s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style></head><body><div class="wrap">
<h1>🌍 Science Ch.3 Quiz</h1>
<div class="sub">3.4 Weathering &amp; Erosion · 3.5 Fossils · 3.6 Resources</div>
<div class="nav" id="nav"></div>
<div class="card" id="card"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const TERMS=[
["atmosphere","the layer of gases held to the earth by gravity"],
["biosphere","the part of the earth where life exists"],
["hydrosphere","all of the earth's water"],
["weathering","rocks broken down into loose pieces called sediments by the forces of nature"],
["sediment","loose pieces of broken-down rock, from tiny clay and silt to large boulders"],
["chemical weathering","the properties of rock are changed by acid, usually in water"],
["physical weathering","rock broken down by physical forces of nature, such as freezing water, plant roots, wind, and flowing water"],
["erosion","sediments carried away by wind or running water"],
["deposition","the settling of sediments at new locations"],
["delta","landform at a river's mouth that looks triangular because the load deposits rapidly"],
["alluvial fan","landform at a river's mouth that looks spread out because the load deposits slowly"],
["glacier","thick ice sheet that slowly moves under its own weight"],
["moraines","piles of large rocks left by glaciers"],
["planation surface","flat surface of land where rock has been eroded by running water"],
["fossil","remains or impression of living things, usually preserved in sedimentary rock"],
["fossil record","fossils found in rock that reveal clues about the history of living things"],
["paleontologist","scientist who studies fossils"],
["transitional form","term evolutionists use for a \"missing link\" between two kinds of animals"],
["bone bed","fossil graveyard in which the remains of more than one animal have been found"],
["geologic column","graphic organizer that illustrates how evolutionists interpret the fossil record"],
["metal","mineral that has luster, is heavier than water, can usually conduct electricity, and is malleable"],
["ore","mineral containing metal"],
["alloy","a mixture of two metals"],
["precious stone","rare, valuable, very hard mineral, such as diamond, ruby, sapphire, or emerald"],
["fossil fuel","nonrenewable energy source, such as coal, petroleum, or natural gas, made from the remains of living organisms"],
["coal","sedimentary rock formed from the remains of living things instead of minerals"],
["petroleum","thick, dark liquid fossil fuel, also called crude oil"],
["natural gas","vaporous fossil fuel"],
["emissions","release of gases from the use of fuel"],
["geothermal energy","use of hot springs to generate electricity"],
["solar energy","energy from the sun; electricity produced using this energy"],
["wind power","use of wind to generate electricity through a turbine"],
["hydropower","use of moving water power to generate electricity"],
["biofuel","use of plant and animal products to create alternative fuel"]];
const mcRaw=[
["The settling of sediments in new locations is called ___.","deposition",["erosion","weathering","emissions"]],
["Rocks broken down into loose pieces by the forces of nature is called ___.","weathering",["deposition","erosion","a glacier"]],
["Which type of weathering changes rock with acid?","chemical weathering",["physical weathering","deposition","erosion"]],
["Which of these produce acids that break down rock?","mosses and lichens",["sandstorms","moraines","deltas"]],
["When water freezes in the cracks of rocks, it ___.","expands",["shrinks","evaporates","turns to acid"]],
["Sediments are carried away by wind or running water through ___.","erosion",["deposition","weathering","humus"]],
["A thick ice sheet that slowly moves under its own weight is a ___.","glacier",["delta","moraine","dune"]],
["Piles of large rocks left by a glacier are called ___.","moraines",["deltas","strata","dunes"]],
["Which landform looks triangular because the load deposits rapidly?","delta",["alluvial fan","moraine","plateau"]],
["An alluvial fan looks spread out because the load deposits ___.","slowly",["rapidly","only at night","in glaciers"]],
["Contour plowing means plowing ___.","across the slope",["up and down the slope","only in winter","under water"]],
["Terracing is used on ___ land.","steeper",["flat","frozen","desert"]],
["A scientist who studies fossils is called a ___.","paleontologist",["seismologist","volcanologist","geologist only"]],
["Another word for a fossil graveyard is a ___.","bone bed",["moraine","coal seam","delta"]],
["Most fossils are found in ___ rock.","sedimentary",["igneous","metamorphic","volcanic"]],
["Evolutionists use the ___ to show the order in which living things supposedly evolved.","geologic column",["fossil record","bone bed","rock cycle"]],
["Mary Anning searched for fossils on the cliffs of ___.","Lyme Regis",["the Grand Canyon","Mount Everest","Crater Lake"]],
["Any mineral that contains metal is called ___.","ore",["alloy","humus","coal"]],
["Which of these is NOT a property of metal?","fossil fuel",["conducts electricity","heavier than water","malleable"]],
["Copper and zinc form an alloy called ___.","brass",["bronze","steel","platinum"]],
["Which metal is the best conductor of electricity?","silver",["copper","iron","gold"]],
["Which is the hardest mineral on earth?","diamond",["ruby","quartz","emerald"]],
["Which of these is NOT a precious stone?","opal",["emerald","ruby","sapphire"]],
["Which fossil fuel is a sedimentary rock?","coal",["petroleum","natural gas","uranium"]],
["Which fossil fuel is used to make gasoline?","petroleum",["coal","natural gas","ore"]],
["Which energy source produces emissions?","coal",["solar energy","wind power","hydropower"]],
["Which alternative energy source can only be used near tectonic plates?","geothermal energy",["solar energy","wind power","hydropower"]],
["Which of these is an alternative energy source?","biofuel",["coal","natural gas","petroleum"]],
["Which is the fastest-growing renewable energy?","wind power",["biofuel","geothermal energy","coal"]]];
const tf=[
["The atmosphere, biosphere, and hydrosphere constantly interact with the geosphere.",true,""],
["Chemical weathering changes the properties of rock with acid.",true,""],
["Moraines are piles of sand left by the wind.",false,"Moraines are piles of large rocks left by glaciers."],
["Glaciers move slowly under their own weight.",true,""],
["A delta looks triangular because the load deposits rapidly.",true,""],
["Fast-moving water can carry more sediment and a larger load.",true,""],
["Contour plowing means plowing up and down the slope.",false,"Contour plowing is plowing ACROSS the slope."],
["Dams and levees can help prevent erosion from flooding rivers.",true,""],
["Most fossils are found in igneous rock.",false,"Most fossils are found in sedimentary rock."],
["Another word for a fossil graveyard is a bone bed.",true,""],
["Coal is a sedimentary rock.",true,"It is formed from the remains of living things instead of minerals."],
["Gold is the most malleable metal.",true,""],
["Iron is the best conductor of electricity.",false,"Silver is the best conductor (copper is used because it costs less)."],
["Platinum is more valuable than gold.",true,""],
["Diamonds are semiprecious stones.",false,"Diamonds are precious stones, the hardest of all minerals."],
["Geothermal energy can be used anywhere.",false,"It is only available in specific areas near tectonic plate activity."],
["Petroleum is also called crude oil.",true,""],
["Hydropower will always be renewable because of the continuous water cycle.",true,""]];
const fbRaw=[
["The settling of sediments in new locations is called ___.",["deposition"]],
["Rocks are weathered and broken down into loose pieces called ___.",["sediments","sediment"]],
["The properties of rock can be changed by acid through chemical ___.",["weathering"]],
["Sediments are carried away by wind or water through ___.",["erosion"]],
["A thick ice sheet that slowly moves under its own weight is called a ___.",["glacier"]],
["Piles of large rocks left by a glacier are called ___.",["moraines","moraine"]],
["A scientist who studies fossils is called a ___.",["paleontologist"]],
["Another word for a fossil graveyard is a ___ bed.",["bone"]],
["Evolutionary scientists use the ___ column to show the order in which they believe living things evolved.",["geologic"]],
["A mineral that contains metal is called ___.",["ore"]],
["A mixture of two metals is called an ___.",["alloy"]],
["Copper and tin form ___.",["bronze"]],
["The hardest of all minerals is the ___.",["diamond"]],
["The thick, dark liquid fossil fuel is called ___.",["petroleum","crude oil"]],
["The vaporous fossil fuel is ___ gas.",["natural"]],
["The release of gases from the use of fuel is called ___.",["emissions"]],
["Energy that uses hot springs is called ___ energy.",["geothermal"]],
["Using moving water to generate electricity is called ___.",["hydropower"]],
["The fastest-growing renewable energy is ___ power.",["wind"]]];
const MODES=[["flash","🃏 Flashcards"],["mc","Multiple Choice"],["tf","True / False"],["fb","Fill-in"],["match","Matching"],["all","🏆 Mixed Test"]];
let st={};
function nav(m){$("nav").innerHTML=MODES.map(x=>`<button class="${x[0]==m?'on':''}" onclick="start('${x[0]}')">${x[1]}</button>`).join("")}
function build(m){
 const mc=mcRaw.map(x=>({t:"mc",q:x[0],a:x[1],o:sh([x[1],...x[2]])}));
 const t=tf.map(x=>({t:"tf",q:x[0],a:x[1],e:x[2]}));
 const f=fbRaw.map(x=>({t:"fb",q:x[0],a:x[1]}));
 if(m=="mc")return sh(mc);if(m=="tf")return sh(t);if(m=="fb")return sh(f);
 return sh([...sh(mc).slice(0,8),...sh(t).slice(0,6),...sh(f).slice(0,6)]);
}
function start(m){
 nav(m);
 if(m=="flash"){st={m,i:0,list:sh(TERMS),back:false};return flash()}
 if(m=="match")return match();
 st={m,i:0,q:build(m),res:[]};renderQ();
}
function flash(){
 const c=st.list[st.i];
 $("card").innerHTML=`<div class="top"><span>Card ${st.i+1} / ${st.list.length}</span><span>Tap card to flip</span></div>
 <div class="bar"><i style="width:${(st.i+1)/st.list.length*100}%"></i></div>
 <div class="flash ${st.back?'back':''}" onclick="st.back=!st.back;flash()">${st.back?c[1]:c[0]}</div>
 <div class="hint">${st.back?'Definition':'Term'}</div>
 <div class="row"><button class="btn gray" ${st.i==0?'disabled':''} onclick="st.i--;st.back=false;flash()">← Prev</button>
 <button class="btn gray" onclick="st.list=sh(TERMS);st.i=0;st.back=false;flash()">🔀</button>
 <button class="btn" ${st.i==st.list.length-1?'disabled':''} onclick="st.i++;st.back=false;flash()">Next →</button></div>`;
}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/^(the|a|an) /,"").trim()}
function score(){return st.res.filter(r=>r&&r.ok).length}
function renderQ(){
 const n=st.q.length;
 if(st.i>=n)return results();
 const q=st.q[st.i],r=st.res[st.i],done=!!r;
 let body="";
 if(q.t=="mc")body=q.o.map((o,k)=>{let c="";if(done){if(o==q.a)c="ok";else if(o==r.g)c="no"}return `<button class="opt ${c}" ${done?'disabled':''} onclick="ans(${k})">${o}</button>`}).join("");
 if(q.t=="tf")body=[true,false].map(v=>{let c="";if(done){if(v==q.a)c="ok";else if(v==r.g)c="no"}return `<button class="opt ${c}" ${done?'disabled':''} onclick="ansTF(${v})">${v?'✅ True':'❌ False'}</button>`}).join("");
 if(q.t=="fb")body=`<input class="fb" id="fi" placeholder="Type your answer" autocomplete="off" autocapitalize="off" ${done?'disabled value="'+r.g.replace(/"/g,'')+'"':''} onkeydown="if(event.key=='Enter')ansFB()">`+(done?'':`<div class="row"><span></span><button class="btn" onclick="ansFB()">Check</button></div>`);
 let fk="";
 if(done){
  const corr=q.t=="tf"?(q.a?"True":"False"):q.t=="fb"?q.a[0]:q.a;
  fk=`<div class="fbk ${r.ok?'ok':'no'}">${r.ok?'🎉 Correct!':'❌ The answer is: <b>'+corr+'</b>'}${q.e?'<br>'+q.e:''}</div>`;
 }
 $("card").innerHTML=`<div class="bar"><i style="width:${(st.i+(done?1:0))/n*100}%"></i></div>
 <div class="top"><span>Question ${st.i+1} / ${n}</span><span>⭐ ${score()}</span></div>
 <div class="q">${q.q}</div>${body}${fk}
 <div class="row"><button class="btn gray" ${st.i==0?'disabled':''} onclick="st.i--;renderQ()">← Prev</button>
 <button class="btn" ${done?'':'disabled'} onclick="st.i++;renderQ()">${st.i==n-1?'Results':'Next →'}</button></div>`;
 if(q.t=="fb"&&!done)setTimeout(()=>{const e=$("fi");e&&e.focus()},50);
}
function ans(k){const q=st.q[st.i];if(st.res[st.i])return;const g=q.o[k];st.res[st.i]={g,ok:g==q.a};renderQ()}
function ansTF(v){const q=st.q[st.i];if(st.res[st.i])return;st.res[st.i]={g:v,ok:v==q.a};renderQ()}
function ansFB(){const q=st.q[st.i];if(st.res[st.i])return;const g=$("fi").value;if(!g.trim())return;st.res[st.i]={g,ok:q.a.some(a=>norm(a)==norm(g))};renderQ()}
function results(){
 const n=st.q.length,s=score(),p=Math.round(s/n*100);
 const wr=st.q.map((q,i)=>[q,st.res[i]]).filter(x=>x[1]&&!x[1].ok);
 const corr=q=>q.t=="tf"?(q.a?"True":"False"):q.t=="fb"?q.a[0]:q.a;
 $("card").innerHTML=`<div class="big">${s} / ${n}</div><div style="text-align:center;font-size:18px;margin:6px 0 14px">${p}% — ${p>=90?'Amazing! 🌟':p>=70?'Great job! 👍':'Keep practicing! 💪'}</div>
 ${wr.length?'<b>Review your mistakes:</b>'+wr.map(x=>`<div class="rev">${x[0].q}<br>✅ <b>${corr(x[0])}</b>${x[0].e?'<br><i>'+x[0].e+'</i>':''}</div>`).join(''):'<div style="text-align:center">Perfect score — no mistakes! 🎊</div>'}
 <div class="row"><button class="btn gray" onclick="st.i=0;renderQ()">Review all</button><button class="btn" onclick="start('${st.m}')">Try again 🔁</button></div>`;
 if(p>=80)confetti();
}
function match(){
 const pairs=sh(TERMS).slice(0,8);
 st={m:"match",pairs,L:sh(pairs.map((p,i)=>i)),R:sh(pairs.map((p,i)=>i)),sel:null,done:{},tries:0};drawMatch();
}
function drawMatch(){
 const d=Object.keys(st.done).length,n=st.pairs.length;
 const L=st.L.map(i=>`<button id="l${i}" class="${st.done[i]?'done':st.sel===i?'sel':''}" ${st.done[i]?'disabled':''} onclick="pickL(${i})">${st.pairs[i][0]}</button>`).join("");
 const R=st.R.map(i=>`<button id="r${i}" class="${st.done[i]?'done':''}" ${st.done[i]?'disabled':''} onclick="pickR(${i})">${st.pairs[i][1]}</button>`).join("");
 $("card").innerHTML=`<div class="bar"><i style="width:${d/n*100}%"></i></div>
 <div class="top"><span>Matched ${d} / ${n}</span><span>Tries: ${st.tries}</span></div>
 <div class="q" style="font-size:15px">Tap a term, then tap its meaning.</div>
 <div class="mt"><div>${L.replace(/<button/g,'<button style="width:100%;margin-bottom:8px"')}</div><div>${R.replace(/<button/g,'<button style="width:100%;margin-bottom:8px"')}</div></div>
 ${d==n?`<div class="fbk ok" style="text-align:center">🎉 All matched in ${st.tries} tries!</div><div class="row"><span></span><button class="btn" onclick="match()">New set 🔁</button></div>`:''}`;
 if(d==n&&st.tries<=n+3)confetti();
}
function pickL(i){st.sel=i;drawMatch()}
function pickR(i){
 if(st.sel===null)return;
 st.tries++;
 if(st.sel===i){st.done[i]=true;st.sel=null;drawMatch()}
 else{const b=$("r"+i);drawMatch();$("r"+i).classList.add("bad");setTimeout(()=>{const e=$("r"+i);e&&e.classList.remove("bad")},500)}
}
function confetti(){
 const e=["🎉","⭐","🌟","🎊","🦴","⚡"];
 for(let i=0;i<30;i++){const s=document.createElement("span");s.className="conf";s.textContent=e[i%e.length];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),3600)}
}
start("flash");
</script></body></html>
