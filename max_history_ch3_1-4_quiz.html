<style>
html,body{background:#eef4ff!important;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1d2b4f}
.wrap{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:20px;text-align:center;margin:8px 0 2px}
.sub{text-align:center;font-size:13px;color:#5a6a92;margin-bottom:10px}
.nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.nav button{border:2px solid #3b6fd8;background:#fff;color:#3b6fd8;border-radius:20px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer}
.nav button.on{background:#3b6fd8;color:#fff}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 12px rgba(30,60,120,.12)}
.bar{height:8px;background:#dde6fa;border-radius:6px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:#3bb273;width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;font-size:13px;color:#5a6a92;margin-bottom:12px}
.q{font-size:18px;font-weight:600;line-height:1.4;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:2px solid #cdd9f5;background:#f8faff;border-radius:12px;font-size:16px;cursor:pointer;color:#1d2b4f}
.opt:disabled{cursor:default}
.opt.ok{background:#d9f5e3;border-color:#3bb273}
.opt.no{background:#fde0e0;border-color:#e05555}
input.fb{width:100%;box-sizing:border-box;padding:12px;font-size:17px;border:2px solid #cdd9f5;border-radius:12px}
.fbk{margin-top:12px;padding:10px;border-radius:10px;font-size:15px;line-height:1.4}
.fbk.ok{background:#d9f5e3}.fbk.no{background:#fde0e0}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{border:none;background:#3b6fd8;color:#fff;font-size:16px;font-weight:600;padding:11px 18px;border-radius:12px;cursor:pointer}
.btn.gray{background:#aab6d6}.btn:disabled{opacity:.4;cursor:default}
.flash{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:600;padding:18px;border-radius:14px;background:#fff7dc;border:2px dashed #e0b83c;cursor:pointer;line-height:1.4}
.flash.back{background:#dff3ff;border-color:#4aa3d8;font-weight:500;font-size:18px}
.hint{text-align:center;font-size:12px;color:#8a97b8;margin-top:6px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt button{padding:10px;border:2px solid #cdd9f5;background:#f8faff;border-radius:10px;font-size:14px;cursor:pointer;color:#1d2b4f;text-align:left}
.mt button.sel{border-color:#3b6fd8;background:#e3ecff}
.mt button.done{background:#d9f5e3;border-color:#3bb273;opacity:.7}
.mt button.bad{background:#fde0e0;border-color:#e05555}
.big{font-size:44px;text-align:center;font-weight:800;color:#3b6fd8}
.rev{font-size:14px;border-top:1px solid #e1e8fa;padding:8px 0;line-height:1.4}
.conf{position:fixed;top:-30px;font-size:24px;animation:fall 2.6s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style></head><body><div class="wrap">
<h1>🏺 History Ch.3 Quiz</h1>

</div>
<script>
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const TERMS=[

["Jericho","walled city conquered by Israel"],

["Tiglath-pileser III","powerful Assyrian king who controlled most of the Fertile Crescent, part of Asia Minor, and part of Egypt"],

["Nabopolassar","Chaldean king who overthrew the Assyrian Empire"],
["Second (New) Babylonian Empire","established by the Chaldean king Nabopolassar"],
["Nebuchadnezzar II","Chaldean king, son of Nabopolassar, who hoped to make Babylon the world's most beautiful city"],
["Daniel","Jewish captive who was trained to serve the king of Babylon"],
["Belshazzar","Nebuchadnezzar's grandson who ruled Babylon"],
["Cyrus the Great","leader of Persia who invaded Babylon, killed Belshazzar, and conquered the Second Babylonian Empire"],
["Persian Empire","one of the largest empires in history under Cyrus the Great"],

["Darius III","last king of the Persian Empire"]];
const mcRaw=[
["Israel is located between the Mediterranean Sea and the ___.","Jordan River",["Red Sea","Euphrates River","Nile River"]],
["The source of the Jordan River is ___.","Mount Hermon",["Mount Sinai","Mount Ararat","the Dead Sea"]],
["Israel's largest freshwater lake is the ___.","Sea of Galilee",["Dead Sea","Mediterranean Sea","Red Sea"]],
["The lowest place on the earth's land surface is the ___.","Dead Sea",["Sea of Galilee","Mount Hermon","Jordan River"]],
["Israel has a ___ climate with mild, rainy winters and hot, dry summers.","Mediterranean",["arctic","tropical","polar"]],
["The Israelites are the descendants of ___.","Abraham, Isaac, and Jacob",["Noah, Ham, and Esau","Saul, David, and Solomon","Moses, Aaron, and Joshua"]],
["The title given to the king of Egypt was ___.","pharaoh",["judge","emperor","Baal"]],
["Who was chosen by God to lead the Israelites out of slavery?","Moses",["Joshua","David","Daniel"]],
["The land lying between Egypt and Canaan is the ___.","Sinai Peninsula",["Arabian Peninsula","Fertile Crescent","Mesopotamia"]],
["God gave Moses the Ten Commandments on ___.","Mount Sinai",["Mount Hermon","Mount Ararat","Mount Carmel"]],
["Who led the Israelites into Canaan?","Joshua",["Moses","Saul","Solomon"]],
["The Canaanites descended from this son of Noah.","Ham",["Judah","Baal","Saul"]],
["The most well-known Canaanite god was ___.","Baal",["Ham","Judah","Saul"]],
["Which walled city fell to Israel after shouts and trumpet blasts?","Jericho",["Babylon","Nineveh","Jerusalem"]],
["A judge in the Bible was a ___.","leader who delivered the Israelites from conquerors",["Canaanite god","walled city","king of Egypt"]],
["The first king of Israel was ___.","Saul",["David","Solomon","Joshua"]],
["The second king of Israel was ___.","David",["Saul","Solomon","Moses"]],
["The wisest man who ever lived was ___.","Solomon",["David","Saul","Daniel"]],
["The Northern Kingdom was also known as ___.","Israel",["Judah","Assyria","Jerusalem"]],
["The Southern Kingdom was called ___.","Judah",["Israel","Assyria","Babylon"]],
["The Southern Kingdom included the city of ___.","Jerusalem",["Nineveh","Jericho","Babylon"]],
["The capital city of Assyria was ___.","Nineveh",["Babylon","Jerusalem","Jericho"]],
["Which powerful king, along with his sons, controlled most of the Fertile Crescent?","Tiglath-pileser III",["Sennacherib","Hammurabi","Nebuchadnezzar II"]],
["Which Assyrian king attacked Judah and boasted that God had no power to save them?","Sennacherib",["Tiglath-pileser III","Nabopolassar","Cyrus the Great"]],
["Which document set the standard for future law codes?","Code of Hammurabi",["Ten Commandments","Cyrus Cylinder","Book of Judges"]],
["Hammurabi ruled during the ___.","First Babylonian Empire",["Assyrian Empire","Persian Empire","Greek Empire"]],
["Which Chaldean king overthrew the Assyrian Empire?","Nabopolassar",["Nebuchadnezzar II","Hammurabi","Sennacherib"]],
["Who hoped to make Babylon the most beautiful city in the world?","Nebuchadnezzar II",["Nabopolassar","Belshazzar","Cyrus the Great"]],
["Which Jewish captive was trained to serve the king of Babylon?","Daniel",["Moses","Joshua","Darius III"]],
["King Belshazzar was the grandson of ___.","Nebuchadnezzar II",["Nabopolassar","Cyrus the Great","Hammurabi"]],
["The statue in Nebuchadnezzar's dream represented ___ great kingdoms.","four",["two","three","seven"]],
["Which Persian leader invaded Babylon and killed Belshazzar?","Cyrus the Great",["Alexander the Great","Darius III","Nabopolassar"]],
["Who allowed the captive Jews to return to Jerusalem to rebuild their Temple?","Cyrus the Great",["Alexander the Great","Nebuchadnezzar II","Belshazzar"]],
["Which Greek ruler defeated the Persian Empire?","Alexander the Great",["Cyrus the Great","Darius III","Hammurabi"]],
["The last king of the Persian Empire was ___.","Darius III",["Cyrus the Great","Belshazzar","Nabopolassar"]]];
const tf=[
["Israel is located between the Mediterranean Sea and the Jordan River.",true,""],
["The Dead Sea is the highest place on the earth's land surface.",false,"The Dead Sea is the LOWEST place on the earth's land surface."],
["The Sea of Galilee is also known as Lake Tiberias.",true,""],
["The Israelites are descendants of Ham.",false,"They are descendants of Abraham, Isaac, and Jacob. The Canaanites descended from Ham."],
["The pharaoh was the king of Egypt.",true,""],
["God gave Moses the Ten Commandments on Mount Hermon.",false,"It was Mount Sinai. Mount Hermon is the source of the Jordan River."],
["Joshua led the Israelites out of slavery in Egypt.",false,"Moses led them out of slavery. Joshua led them into Canaan."],
["Moses led the Israelites in the wilderness for forty years.",true,""],
["The Canaanites were descendants of Noah's son Ham.",true,""],
["The Israelites completely destroyed the Canaanites, just as God commanded.",false,"They chose not to obey, and the Canaanites left in the land caused many problems."],
["Saul was Israel's second king.",false,"Saul was the first king. David was the second."],
["Solomon was Israel's third king.",true,""],
["The Northern Kingdom was made up of two tribes.",false,"The Northern Kingdom had ten tribes. The Southern Kingdom (Judah) had two."],
["Babylon was the capital of the Assyrian Empire.",false,"The capital of Assyria was Nineveh."],
["God destroyed 185,000 Assyrian soldiers outside the walls of Jerusalem.",true,""],
["The Code of Hammurabi contained nearly 300 laws.",true,""],
["Nabopolassar established the Second (New) Babylonian Empire.",true,""],
["The statue in Nebuchadnezzar's dream represented two kingdoms.",false,"It represented four great kingdoms."],
["King Belshazzar was the grandson of Nebuchadnezzar.",true,""],
["Alexander the Great of Persia invaded Babylon and conquered the Second Babylonian Empire.",false,"It was Cyrus the Great of Persia. Alexander was a Greek ruler."],
["King Cyrus allowed the Jewish people to rebuild their Temple in Babylon.",false,"He let them rebuild the Temple in Jerusalem."],
["Alexander the Great was a Greek ruler who defeated the Persian Empire.",true,""],
["The last king of the Persian Empire was Nebuchadnezzar.",false,"The last Persian king was Darius III."]];
const fbRaw=[
["Israel's largest freshwater lake is the Sea of ___.",["galilee"]],
["The source of the Jordan River is Mount ___.",["hermon"]],
["The lowest place on the earth's land surface is the ___ Sea.",["dead"]],
["A crack in the earth's surface is called a ___.",["fault"]],
["God's chosen people are called ___, or Hebrews.",["israelites","israelite"]],
["The king of Egypt was called the ___.",["pharaoh"]],
["___ was God's chosen man to lead the Israelites out of slavery.",["moses"]],
["The peninsula between Egypt and Canaan is the ___ Peninsula.",["sinai"]],
["God gave Moses the Ten Commandments on Mount ___.",["sinai"]],
["___ was God's chosen man to lead the Israelites into Canaan.",["joshua"]],
["The most well-known Canaanite god was ___.",["baal"]],
["The Israelites conquered the walled city of ___ with shouts and trumpet blasts.",["jericho"]],
["Before Israel had its first king, a series of ___ led the nation.",["judges","judge"]],
["The first three kings of Israel were Saul, David, and ___.",["solomon"]],
["The Northern Kingdom was called Israel. The Southern Kingdom was called ___.",["judah"]],
["The capital city of Assyria was ___.",["nineveh"]],
["The Assyrian king who boasted that God had no power to save Judah was ___.",["sennacherib"]],
["The document that set the standard for future law codes is the Code of ___.",["hammurabi"]],
["The Chaldean king who overthrew the Assyrian Empire was ___.",["nabopolassar"]],
["King ___ was Nebuchadnezzar's grandson.",["belshazzar"]],
["The Persian leader who invaded Babylon and killed Belshazzar was ___.",["cyrus the great","cyrus"]],
["The Greek ruler who defeated the Persian Empire was ___.",["alexander the great","alexander"]],
["The last king of the Persian Empire was ___.",["darius iii","darius 3","darius"]]];
const MODES=[["flash","🃏 Flashcards"],["mc","Multiple Choice"],["tf","True / False"],["fb","Fill-in"],["match","Matching"],["all","🏆 Mixed Test"]];
let st={};
function nav(m){$("nav").innerHTML=MODES.map(x=>`<button class="${x[0]==m?'on':''}" onclick="start('${x[0]}')">${x[1]}</button>`).join("")}
function build(m){
 const mc=mcRaw.map(x=>({t:"mc",q:x[0],a:x[1],o:sh([x[1],...x[2]])}));
 const t=tf.map(x=>({t:"tf",q:x[0],a:x[1],e:x[2]}));
 const f=fbRaw.map(x=>({t:"fb",q:x[0],a:x[1]}));
 if(m=="mc")return sh(mc);if(m=="tf")return sh(t);if(m=="fb")return sh(f);
 return sh([...sh(mc).slice(0,8),...sh(t).slice(0,6),...sh(f).slice(0,6)]);
}
function start(m){
 nav(m);
 if(m=="flash"){st={m,i:0,list:sh(TERMS),back:false};return flash()}
 if(m=="match")return match();
 st={m,i:0,q:build(m),res:[]};renderQ();
}
function flash(){
 const c=st.list[st.i];
 $("card").innerHTML=`<div class="top"><span>Card ${st.i+1} / ${st.list.length}</span><span>Tap card to flip</span></div>
 <div class="bar"><i style="width:${(st.i+1)/st.list.length*100}%"></i></div>
 <div class="flash ${st.back?'back':''}" onclick="st.back=!st.back;flash()">${st.back?c[1]:c[0]}</div>
 <div class="hint">${st.back?'Definition':'Term'}</div>
 <div class="row"><button class="btn gray" ${st.i==0?'disabled':''} onclick="st.i--;st.back=false;flash()">← Prev</button>
 <button class="btn gray" onclick="st.list=sh(TERMS);st.i=0;st.back=false;flash()">🔀</button>
 <button class="btn" ${st.i==st.list.length-1?'disabled':''} onclick="st.i++;st.back=false;flash()">Next →</button></div>`;
}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/^(the|a|an) /,"").trim()}
function score(){return st.res.filter(r=>r&&r.ok).length}
function renderQ(){
 const n=st.q.length;
 if(st.i>=n)return results();
 const q=st.q[st.i],r=st.res[st.i],done=!!r;
 let body="";
 if(q.t=="mc")body=q.o.map((o,k)=>{let c="";if(done){if(o==q.a)c="ok";else if(o==r.g)c="no"}return `<button class="opt ${c}" ${done?'disabled':''} onclick="ans(${k})">${o}</button>`}).join("");
 if(q.t=="tf")body=[true,false].map(v=>{let c="";if(done){if(v==q.a)c="ok";else if(v==r.g)c="no"}return `<button class="opt ${c}" ${done?'disabled':''} onclick="ansTF(${v})">${v?'✅ True':'❌ False'}</button>`}).join("");
 if(q.t=="fb")body=`<input class="fb" id="fi" placeholder="Type your answer" autocomplete="off" autocapitalize="off" ${done?'disabled value="'+r.g.replace(/"/g,'')+'"':''} onkeydown="if(event.key=='Enter')ansFB()">`+(done?'':`<div class="row"><span></span><button class="btn" onclick="ansFB()">Check</button></div>`);
 let fk="";
 if(done){
  const corr=q.t=="tf"?(q.a?"True":"False"):q.t=="fb"?q.a[0]:q.a;
  fk=`<div class="fbk ${r.ok?'ok':'no'}">${r.ok?'🎉 Correct!':'❌ The answer is: <b>'+corr+'</b>'}${q.e?'<br>'+q.e:''}</div>`;
 }
 $("card").innerHTML=`<div class="bar"><i style="width:${(st.i+(done?1:0))/n*100}%"></i></div>
 <div class="top"><span>Question ${st.i+1} / ${n}</span><span>⭐ ${score()}</span></div>
 <div class="q">${q.q}</div>${body}${fk}
 <div class="row"><button class="btn gray" ${st.i==0?'disabled':''} onclick="st.i--;renderQ()">← Prev</button>
 <button class="btn" ${done?'':'disabled'} onclick="st.i++;renderQ()">${st.i==n-1?'Results':'Next →'}</button></div>`;
 if(q.t=="fb"&&!done)setTimeout(()=>{const e=$("fi");e&&e.focus()},50);
}
function ans(k){const q=st.q[st.i];if(st.res[st.i])return;const g=q.o[k];st.res[st.i]={g,ok:g==q.a};renderQ()}
function ansTF(v){const q=st.q[st.i];if(st.res[st.i])return;st.res[st.i]={g:v,ok:v==q.a};renderQ()}
function ansFB(){const q=st.q[st.i];if(st.res[st.i])return;const g=$("fi").value;if(!g.trim())return;st.res[st.i]={g,ok:q.a.some(a=>norm(a)==norm(g))};renderQ()}
function results(){
 const n=st.q.length,s=score(),p=Math.round(s/n*100);
 const wr=st.q.map((q,i)=>[q,st.res[i]]).filter(x=>x[1]&&!x[1].ok);
 const corr=q=>q.t=="tf"?(q.a?"True":"False"):q.t=="fb"?q.a[0]:q.a;
 $("card").innerHTML=`<div class="big">${s} / ${n}</div><div style="text-align:center;font-size:18px;margin:6px 0 14px">${p}% — ${p>=90?'Amazing! 🌟':p>=70?'Great job! 👍':'Keep practicing! 💪'}</div>
 ${wr.length?'<b>Review your mistakes:</b>'+wr.map(x=>`<div class="rev">${x[0].q}<br>✅ <b>${corr(x[0])}</b>${x[0].e?'<br><i>'+x[0].e+'</i>':''}</div>`).join(''):'<div style="text-align:center">Perfect score — no mistakes! 🎊</div>'}
 <div class="row"><button class="btn gray" onclick="st.i=0;renderQ()">Review all</button><button class="btn" onclick="start('${st.m}')">Try again 🔁</button></div>`;
 if(p>=80)confetti();
}
function match(){
 const pairs=sh(TERMS).slice(0,8);
 st={m:"match",pairs,L:sh(pairs.map((p,i)=>i)),R:sh(pairs.map((p,i)=>i)),sel:null,done:{},tries:0};drawMatch();
}
function drawMatch(){
 const d=Object.keys(st.done).length,n=st.pairs.length;
 const L=st.L.map(i=>`<button id="l${i}" class="${st.done[i]?'done':st.sel===i?'sel':''}" ${st.done[i]?'disabled':''} onclick="pickL(${i})">${st.pairs[i][0]}</button>`).join("");
 const R=st.R.map(i=>`<button id="r${i}" class="${st.done[i]?'done':''}" ${st.done[i]?'disabled':''} onclick="pickR(${i})">${st.pairs[i][1]}</button>`).join("");
 $("card").innerHTML=`<div class="bar"><i style="width:${d/n*100}%"></i></div>
 <div class="top"><span>Matched ${d} / ${n}</span><span>Tries: ${st.tries}</span></div>
 <div class="q" style="font-size:15px">Tap a term, then tap its meaning.</div>
 <div class="mt"><div>${L.replace(/<button/g,'<button style="width:100%;margin-bottom:8px"')}</div><div>${R.replace(/<button/g,'<button style="width:100%;margin-bottom:8px"')}</div></div>
 ${d==n?`<div class="fbk ok" style="text-align:center">🎉 All matched in ${st.tries} tries!</div><div class="row"><span></span><button class="btn" onclick="match()">New set 🔁</button></div>`:''}`;
 if(d==n&&st.tries<=n+3)confetti();
}
function pickL(i){st.sel=i;drawMatch()}
function pickR(i){
 if(st.sel===null)return;
 st.tries++;
 if(st.sel===i){st.done[i]=true;st.sel=null;drawMatch()}
 else{const b=$("r"+i);drawMatch();$("r"+i).classList.add("bad");setTimeout(()=>{const e=$("r"+i);e&&e.classList.remove("bad")},500)}
}
function confetti(){
 const e=["🎉","⭐","🌟","🎊","👑","🏺"];
 for(let i=0;i<30;i++){const s=document.createElement("span");s.className="conf";s.textContent=e[i%e.length];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),3600)}
}
start("flash");
</script></body></html>
