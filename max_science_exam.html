const $=s=>document.querySelector(s);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').replace(/^(a|an|the) /,'').trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=0;j<=b.length;j++)m[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function fibOk(inp,acc){const x=norm(inp);if(!x)return false;
 return acc.some(a=>{a=norm(a);return x==a||x.replace(/ /g,'')==a.replace(/ /g,'')||(a.length>5&&lev(x,a)<=1)})}
const ansHtml=a=>Array.isArray(a)?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':esc(a);
const ansText=a=>Array.isArray(a)?a.join(' · '):a;
const qPlain=q=>q.replace(/<\/?u>/g,'');
const qid=id=>/^\d/.test(id)?'Q'+id:id;

 for(let i=0;i<60;i++){const d=document.createElement('div');d.className='cf';
 d.style.left=Math.random()*100+'vw';d.style.background=c[i%5];d.style.animationDelay=Math.random()*.8+'s';
 document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}}

let Q={list:[],i:0,res:[],mode:''};
function initQuiz(){let l=pool().filter(x=>!/^Label/.test(x.id));const M=S.mode;
 if(M=='adv')l=shuf(l.filter(x=>!x.noscore)).slice(0,12);
 else if(M=='fill')l=shuf(l.filter(x=>x.t=='fib'));
 else if(M=='tf')l=shuf(l.filter(x=>x.t=='tf'));
 else if(M=='recall')l=l.filter(x=>x.t=='self');
 else if(M=='test')l=shuf(l.filter(x=>!x.noscore)).slice(0,30);
 Q={list:l,i:0,res:[],mode:M};streak=0;hud();drawQ()}
const scored=()=>Q.list.filter(x=>!x.noscore);
function score(){return Q.list.reduce((s,it,i)=>s+((Q.res[i]&&Q.res[i].ok&&!it.noscore)?1:0),0)}
function done(r,it){return r&&(it.noscore?r.shown:r.ok!==null&&r.ok!==undefined)}
function drawQ(){
 if(!Q.list.length)return $('#app').innerHTML='<div class="card">Nothing here for this chapter. Try another mode or chapter.</div>';
 if(Q.i>=Q.list.length)return results();
 const it=Q.list[Q.i],r=Q.res[Q.i],n=Q.list.length;
 let body='',fb='';
 if(it.t=='fib'){
  body=`<input class="fib" id="fi" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" ${r?'disabled value="'+esc(r.pick)+'"':''} onkeydown="if(event.key=='Enter')checkFib()">${r?'':'<div class="row"><button class="btn" onclick="checkFib()">Check</button></div>'}`;
  if(r)fb=`<div class="fb ${r.ok?'good':'bad'}">${r.ok?'✅ Correct! +XP':'❌ Not quite. Answer: <b>'+esc(it.ans)+'</b>'}${it.note?'<br><i>'+esc(it.note)+'</i>':''}</div>`}
 else if(it.t=='tf'){
  const cls=v=>!r?'':(v===it.tf?'good':(v===r.pick?'bad':''));
  body=`<div class="two"><button class="opt ${cls(true)}" ${r?'disabled':''} onclick="tfPick(true)">True</button><button class="opt ${cls(false)}" ${r?'disabled':''} onclick="tfPick(false)">False</button></div>`;
  if(r&&r.stage==1)body+=`<p style="margin:12px 0 6px"><b>Right, it is false. What word replaces the underlined words?</b></p><input class="fib" id="fi" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Correct word" onkeydown="if(event.key=='Enter')tfFix()"><div class="row"><button class="btn" onclick="tfFix()">Check</button></div>`;
  if(r&&r.ok!==null&&r.ok!==undefined)fb=`<div class="fb ${r.ok?'good':'bad'}">${r.ok?'✅ Correct! +XP':'❌ Not quite.'} ${it.tf?'This one is <b>true</b>.':'This one is false.'+(it.plain?'':' Correct: <b>'+esc(it.ans)+'</b>')}${it.note?'<br><i>'+esc(it.note)+'</i>':''}</div>`}
 else{
  body=`<textarea class="fib" id="ta" placeholder="Write your answer here first, then tap Reveal" ${r?'disabled':''}>${r?esc(r.pick||''):''}</textarea>`;
  if(!r)body+=`<div class="row"><button class="btn" onclick="revealSelf()">Reveal answer</button></div>`;
  else{fb=`<div class="fb info"><b>Answer:</b> ${ansHtml(it.ans)}${it.note?'<i>'+esc(it.note)+'</i>':''}</div>`;
   if(it.noscore)fb+=`<div class="fb info">Not scored: the answer isn't confirmed.</div>`;
   else if(r.ok===null)fb+=`<div class="row"><button class="btn ok" onclick="markSelf(true)">⭕ I got it</button><button class="btn no" onclick="markSelf(false)">❌ I missed it</button></div>`;
   else fb+=`<div class="fb ${r.ok?'good':'bad'}">${r.ok?'⭕ Marked correct +XP':'❌ Marked missed'}</div>`}}
 if(r&&TIPS[it.id])fb+=`<div class="tip">💡 ${esc(TIPS[it.id])}</div>`;
 const can=r&&(it.t=='self'?done(r,it):(r.ok!==null&&r.ok!==undefined));
 const bossHp=Q.mode=='test'?`<div class="boss">👹 <div class="bar"><i style="width:${Math.max(0,100-score()/n*100)}%"></i></div> HP</div>`:'';
 $('#app').innerHTML=`<div class="card"><div class="meta"><span>${Q.mode=='test'?'Boss · ':Q.mode=='adv'?'Adventure · ':''}Question ${Q.i+1} / ${n}</span><span><span class="tag">${esc(qid(it.id))}</span> ${CH[it.ch]} · Score ${score()}</span></div>
 ${bossHp}<div class="bar"><i style="width:${Q.i/n*100}%"></i></div>
 ${it.warn?`<div class="warn">⚠️ ${esc(it.warn)}</div>`:''}
 <div class="q">${it.t=='tf'?(it.q.includes('<u>')?'True, or fix the underlined word:<br><span style="font-weight:600">'+it.q+'</span>':'True or False: '+it.q):esc(it.q)}</div>${body}${fb}
 <div class="nav"><button class="btn alt" onclick="Q.i--;drawQ()" ${Q.i==0?'disabled':''}>◀ Prev</button><button class="btn" onclick="Q.i++;drawQ()" ${can?'':'disabled'}>${Q.i==n-1?'Finish':'Next ▶'}</button></div></div>`;
 if(!r&&(it.t=='fib'))setTimeout(()=>{const e=$('#fi');e&&e.focus&&e.focus()},30)}
function checkFib(){const it=Q.list[Q.i];if(Q.res[Q.i])return;const v=$('#fi').value;if(!v.trim())return;
 const ok=fibOk(v,it.acc);Q.res[Q.i]={ok,pick:v};award(it,ok);drawQ()}
function tfPick(v){const it=Q.list[Q.i];if(Q.res[Q.i])return;
 if(v!==it.tf){Q.res[Q.i]={ok:false,pick:v,stage:2};award(it,false)}
 else if(it.tf||it.plain){Q.res[Q.i]={ok:true,pick:v,stage:2};award(it,true)}
 else Q.res[Q.i]={ok:null,pick:v,stage:1};
 drawQ()}
function tfFix(){const it=Q.list[Q.i],r=Q.res[Q.i];if(!r||r.stage!=1)return;const v=$('#fi').value;if(!v.trim())return;
 r.ok=fibOk(v,it.fix);r.stage=2;award(it,r.ok);drawQ()}
function revealSelf(){const t=$('#ta');Q.res[Q.i]={pick:t?t.value:'',shown:true,ok:Q.list[Q.i].noscore?undefined:null};drawQ()}
function markSelf(ok){Q.res[Q.i].ok=ok;award(Q.list[Q.i],ok);drawQ()}
function results(){const L=scored(),n=L.length,s=score(),p=n?Math.round(s/n*100):0;
 const wrong=Q.list.map((it,i)=>({it,r:Q.res[i]})).filter(x=>!x.it.noscore&&(!x.r||!x.r.ok));
 let msg=p>=90?'Amazing! Test-ready! 🌊':p>=70?'Great job! Review the misses below.':'Keep practicing, you can do it!';
 if(Q.mode=='adv'){badge('adv');P.xp+=20;save();hud();msg+=' (+20 bonus XP)'}
 if(Q.mode=='test'){msg=p>=80?'👹 You defeated the Boss!':'The Boss survived with '+Math.round(100-p)+'% HP. Try again!';if(p>=80)badge('boss')}
 if(p>=80)confetti();
 $('#app').innerHTML=`<div class="card"><div class="big">${s} / ${n} (${p}%)</div><p style="text-align:center">${msg}</p>
 <div class="nav" style="justify-content:center"><button class="btn" onclick="initQuiz()">Play again</button><button class="btn alt" onclick="S.mode='home';start()">Map</button></div>
 ${wrong.length?'<h3>Review your misses</h3>'+wrong.map(x=>`<div class="rev"><span class="tag">${esc(qid(x.it.id))}</span> <b>${x.it.t=='tf'?qPlain(x.it.q):esc(x.it.q)}</b><br>Answer: ${x.it.t=='tf'?(x.it.tf?'True':'False'+(x.it.plain?'':' → '+esc(x.it.ans))):esc(ansText(x.it.ans))}${x.it.note?'<br><i>'+esc(x.it.note)+'</i>':''}</div>`).join(''):''}</div>`}

let L={i:0,fill:[],sel:0,checked:false,revealed:false};
function initLab(i){L={i:i||0,fill:[],sel:0,checked:false,revealed:false};drawLab()}
function drawLab(){const lab=LABS[L.i],n=lab.pins.length;
 const bankW=shuf0(lab);
 $('#app').innerHTML=`<div class="card lab"><div class="meta"><span>${esc(lab.title)}</span><span>Lab ${L.i+1} / ${LABS.length}${P.labs[lab.id]?' · ⭐ done':''}</span></div>
 <p style="margin:0 0 8px;color:#35637a">Tap a numbered dot (or a slot), then tap the right word. Then press Check.</p>
 <svg viewBox="0 0 420 250" role="img" aria-label="${esc(lab.title)} diagram">${lab.svg}${lab.pins.map((p,k)=>`<g class="pin ${L.sel==k?'sel':''} ${pinCls(k)}" onclick="labSel(${k})"><circle cx="${p.x}" cy="${p.y}" r="11"/><text x="${p.x}" y="${p.y}">${k+1}</text></g>`).join('')}</svg>
 <div class="slots">${lab.pins.map((p,k)=>`<div class="slot ${L.sel==k?'sel':''} ${pinCls(k)}" onclick="labSel(${k})"><span class="n">${k+1}</span><span>${L.fill[k]?esc(L.fill[k]):'<small style="color:#7a9aa9">tap a word…</small>'}${L.revealed&&L.fill[k]!=p.a?'<br><b style="color:#1f7a54">→ '+esc(p.a)+'</b>':''}</span></div>`).join('')}</div>
 <div class="bank">${bankW.map(w=>`<button class="${L.fill.includes(w)?'used':''}" onclick="labPut(this.dataset.w)" data-w="${esc(w).replace(/"/g,'&quot;')}">${esc(w)}</button>`).join('')}</div>
 <div class="row"><button class="btn" onclick="labCheck()">Check</button><button class="btn alt" onclick="L.revealed=true;L.checked=true;drawLab()">Show answers</button><button class="btn alt" onclick="initLab(L.i)">Reset</button></div>
 ${L.checked?`<div class="fb info">${labMsg()}</div><div class="tip">💡 ${esc(lab.tip)}</div>`:''}
 <div class="nav"><button class="btn alt" onclick="initLab(L.i-1)" ${L.i==0?'disabled':''}>◀ Prev</button><button class="btn" onclick="initLab(L.i+1)" ${L.i==LABS.length-1?'disabled':''}>Next ▶</button></div></div>`}
function shuf0(lab){if(!lab._bank)lab._bank=shuf(lab.pins.map(p=>p.a).concat(lab.decoys||[]));return lab._bank}
function pinCls(k){if(!L.checked)return '';return L.fill[k]==LABS[L.i].pins[k].a?'good':'bad'}
function labSel(k){L.sel=k;L.checked=false;drawLab()}
function labPut(w){const k=L.sel;const j=L.fill.indexOf(w);if(j>=0)L.fill[j]=undefined;L.fill[k]=w;L.checked=false;L.revealed=false;
 const nx=LABS[L.i].pins.findIndex((p,x)=>!L.fill[x]);if(nx>=0)L.sel=nx;drawLab()}
function labCheck(){const lab=LABS[L.i];L.checked=true;
 const ok=lab.pins.filter((p,k)=>L.fill[k]==p.a).length;
 const first=!L.labGot;L.labGot=ok;
 const gain=Math.max(0,ok-(L.labGot0||0));L.labGot0=Math.max(L.labGot0||0,ok);P.xp+=gain*5;
 if(ok==lab.pins.length){if(!P.labs[lab.id]){P.labs[lab.id]=1;P.xp+=25;badge('lab');if(LABS.every(l=>P.labs[l.id]))badge('labs')}confetti()}
 save();hud();drawLab()}
function labMsg(){const lab=LABS[L.i],ok=lab.pins.filter((p,k)=>L.fill[k]==p.a).length;
 return ok==lab.pins.length?'🎉 Perfect! '+ok+' / '+ok+' (+25 bonus XP the first time)':ok+' / '+lab.pins.length+' correct. Fix the red ones and check again.'}

start();
</script>
